<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suggs Family Guide">
<title>Suggs Family Guide</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--muted:#5d6570;--line:#e2e5ea;--accent:#1f4fd1;--risk:#b42318;--riskbg:#fdf0ee;--tag:#eef2fb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e9ecf1;--muted:#99a1ad;--line:#2a2f38;--accent:#7aa2ff;--risk:#ff8a7a;--riskbg:#2a1715;--tag:#1d2433}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{border:0;background:none;color:var(--accent);font-size:17px;padding:4px 6px 4px 0;cursor:pointer;visibility:hidden}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px}
.gate h2{margin:0 0 4px;font-size:20px}.gate p{margin:0 0 16px;color:var(--muted);font-size:14px}
.gate input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gate button{margin-top:12px;width:100%;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
#err{color:var(--risk);font-size:14px;min-height:20px;margin-top:8px}
.list{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink)}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--tag);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;color:var(--accent)}
.tile.risk .ic{background:var(--riskbg);color:var(--risk)}
.tile b{display:block;font-size:16px}.tile span{color:var(--muted);font-size:13px}
.tile .chev{margin-left:auto;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.card h3{margin:.2em 0 .5em;font-size:16px}
.muted{color:var(--muted);font-size:14px}
blockquote{margin:8px 0;padding:12px 14px;border-left:4px solid var(--muted);background:rgba(127,127,127,.08);border-radius:6px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
.kv th{width:30%;color:var(--muted);font-weight:600}
.tl td:first-child{white-space:nowrap;color:var(--muted);width:30%}
.cases td:first-child{width:34%}
.tag{display:inline-block;background:var(--tag);color:var(--accent);font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-bottom:3px}
.quote{border-left:3px solid var(--accent);padding:8px 12px;margin:0 0 12px;background:var(--card);border-radius:0 10px 10px 0}
.quote.risk{border-color:var(--risk);background:var(--riskbg)}
.quote .d{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
figure{margin:0 0 12px}
figure img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;border-radius:10px;padding:12px;margin-bottom:12px;border:0;width:100%;font-size:16px;cursor:pointer}
.lnk{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;text-decoration:none}
.lnk b{color:var(--accent)}.lnk span{display:block;color:var(--muted);font-size:13px}
ol,ul{padding-left:20px;margin:.3em 0}li{margin:.3em 0}
.urgent li{margin-bottom:.7em}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
#zoom img{width:100%;max-width:900px;display:block;margin:0 auto;padding:env(safe-area-inset-top) 0 0}
#zoom button{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;font-size:16px;padding:8px 14px;border-radius:20px;border:0;background:#fff;color:#000;font-weight:600}
.foot{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
.rl{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:4;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.rl-row{display:flex;justify-content:center;align-items:center;gap:18px}
.rl-b{border:0;background:var(--tag);color:var(--accent);border-radius:12px;min-width:64px;height:52px;font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rl-b small{font-size:11px;font-weight:600}
.rl-main{background:var(--accent);color:#fff;min-width:72px;height:60px;border-radius:30px;font-size:24px}
#rl-bar{width:100%;margin:14px 0 4px;accent-color:var(--accent);height:28px}
.rl-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.rl-x{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 0}
.rl-now{margin-top:8px;font-size:15px;line-height:1.45;color:var(--ink);border-left:3px solid var(--accent);padding-left:10px}
</style>
</head>
<body>
<div id="gate" class="gate"><form id="f" autocomplete="off">
<h2>Family guide: Anthony Suggs</h2>
<p>Private. Enter the password you were given.</p>
<input id="pw" type="password" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false">
<button type="submit" id="go">Open</button>
<div id="err"></div>
</form></div>
<div id="app" hidden>
<header><button id="back" aria-label="Back">‹ Back</button><h1 id="ttl">Case file</h1></header>
<div class="wrap" id="main"></div>
</div>

let DATA=null;
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(ENC.i)},key,u8(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const err=document.getElementById("err"),go=document.getElementById("go");
  err.textContent="";go.textContent="Opening…";go.disabled=true;
  try{DATA=await unlock(document.getElementById("pw").value);
    try{sessionStorage.setItem("pdk",document.getElementById("pw").value)}catch(_){}
    start();}
  catch(_){err.textContent="Wrong password. Try again.";}
  go.textContent="Open";go.disabled=false;
});
(async()=>{let k=null;try{k=sessionStorage.getItem("pdk")}catch(_){}
  if(k){try{DATA=await unlock(k);start();}catch(_){}}})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function start(){document.getElementById("gate").hidden=true;document.getElementById("gate").style.display="none";
  document.getElementById("app").hidden=false;window.addEventListener("hashchange",route);route();}
const SAY='<button class="btn" id="say" onclick="openPlayer()">🔊 Read this page out loud</button><div id="player" hidden></div>';
// Read-aloud player: one sentence at a time, so it can pause, rewind and jump without starting over.
const RL={parts:[],i:0,playing:false,gen:0};
function openPlayer(){
  if(!("speechSynthesis" in window)){document.getElementById("say").textContent="Read-aloud isn't supported on this device";return;}
  const t=[...document.querySelectorAll("#main .card, #main .lnk")].map(e=>e.innerText).join(". ");
  RL.parts=(t.replace(/\s+/g," ").match(/[^.!?]+[.!?]*/g)||[]).map(x=>x.trim()).filter(x=>x.length>1);
  RL.i=0;
  document.getElementById("say").hidden=true;
  const pl=document.getElementById("player");pl.hidden=false;
  pl.innerHTML=`<div class="rl">
<div class="rl-row">
<button class="rl-b" onclick="rlSkip(-2)" aria-label="Back">⏪<small>Back</small></button>
<button class="rl-b rl-main" id="rl-pp" onclick="rlToggle()" aria-label="Play or pause">⏸</button>
<button class="rl-b" onclick="rlSkip(2)" aria-label="Forward">⏩<small>Ahead</small></button>
</div>
<input type="range" id="rl-bar" min="0" max="${Math.max(RL.parts.length-1,0)}" value="0" aria-label="Where to read from">
<div class="rl-meta"><span id="rl-pos"></span><button class="rl-x" onclick="rlClose()">✕ Close</button></div>
<div class="rl-now" id="rl-now"></div></div>`;
  const bar=document.getElementById("rl-bar");
  bar.oninput=()=>{RL.i=+bar.value;rlShow();};
  bar.onchange=()=>{RL.i=+bar.value;if(RL.playing)rlSpeak();else rlShow();};
  RL.playing=true;rlSpeak();}
function rlShow(){
  const n=RL.parts.length,bar=document.getElementById("rl-bar");if(!bar)return;
  bar.value=RL.i;
  document.getElementById("rl-pos").textContent=n?`Part ${RL.i+1} of ${n}`:"Nothing to read";
  document.getElementById("rl-now").textContent=RL.parts[RL.i]||"";
  document.getElementById("rl-pp").textContent=RL.playing?"⏸":"▶";}
function rlSpeak(){
  const g=++RL.gen;speechSynthesis.cancel();rlShow();
  if(RL.i>=RL.parts.length){RL.playing=false;RL.i=Math.max(RL.parts.length-1,0);rlShow();return;}
  const u=new SpeechSynthesisUtterance(RL.parts[RL.i]);u.rate=0.95;u.lang="en-US";
  u.onend=()=>{if(g!==RL.gen||!RL.playing)return;RL.i++;rlSpeak();};
  setTimeout(()=>{if(g===RL.gen)speechSynthesis.speak(u);},60);}
function rlToggle(){
  if(RL.playing){RL.playing=false;RL.gen++;speechSynthesis.cancel();rlShow();}
  else{RL.playing=true;rlSpeak();}}
function rlSkip(d){RL.i=Math.min(Math.max(RL.i+d,0),Math.max(RL.parts.length-1,0));if(RL.playing)rlSpeak();else rlShow();}
function rlClose(){RL.playing=false;RL.gen++;try{speechSynthesis.cancel()}catch(_){}
  const pl=document.getElementById("player");if(pl){pl.hidden=true;pl.innerHTML="";}
  const b=document.getElementById("say");if(b){b.hidden=false;b.textContent="🔊 Read this page out loud";}}
window.addEventListener("hashchange",()=>{RL.playing=false;RL.gen++;try{speechSynthesis.cancel()}catch(_){}});
function route(){
  const id=location.hash.slice(1),main=document.getElementById("main"),back=document.getElementById("back"),ttl=document.getElementById("ttl");
  const s=DATA.sections.find(x=>x.id===id);window.scrollTo(0,0);
  if(!s){ttl.textContent="Family guide: Anthony Suggs";back.style.visibility="hidden";
    main.innerHTML='<div class="list">'+DATA.sections.map(x=>`<a class="tile${x.id==="risks"?" risk":""}" href="#${x.id}"><div class="ic">${esc(x.icon)}</div><div><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></div><div class="chev">›</div></a>`).join("")+
    `</div><div class="foot">Private family guide · updated ${esc(DATA.built)}</div>`;return;}
  ttl.textContent=s.title;back.style.visibility="visible";
  main.innerHTML=SAY+s.items.map((it,i)=>{
    if(it.t==="html")return `<div class="card">${it.html}</div>`;
    if(it.t==="img")return `<figure><img loading="lazy" src="${it.src}" alt="${esc(it.cap)}" onclick="zoomOn(this.src)"><figcaption>${esc(it.cap)}</figcaption></figure>`;
    if(it.t==="quote")return `<div class="quote${it.flag==="risk"?" risk":""}"><div class="d">${esc(it.date)}</div>“${esc(it.text)}”</div>`;
    if(it.t==="link")return `<a class="lnk" href="${esc(it.url)}" target="_blank" rel="noopener"><b>${esc(it.label)} ↗</b><span>${esc(it.note)}</span></a>`;
    if(it.t==="pdf")return `<button class="btn" onclick="openPdf('${s.id}',${i})">${esc(it.label)}</button>`;
    return "";}).join("")+`<div class="foot"><a href="#">‹ All sections</a></div>`;
}
document.getElementById("back").onclick=()=>{location.hash="";};
function openPdf(sid,i){const it=DATA.sections.find(x=>x.id===sid).items[i];

  const w=window.open(url,"_blank");if(!w)location.href=url;}
function zoomOn(src){const z=document.getElementById("zoom");z.querySelector("img").src=src;z.style.display="block";}
function zoomOff(){document.getElementById("zoom").style.display="none";}

<script>
(function(){
var NAME="Family guide",PK="familyBio1",REM="";
var SALT=new TextEncoder().encode("antidote-"+PK+"-prf-v1");
var form=document.getElementById("f"),pwEl=document.getElementById("pw"),gate=document.getElementById("gate");
if(!form||!pwEl||!gate)return;
function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function b64(a){return btoa(String.fromCharCode.apply(null,new Uint8Array(a)))}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function del(k){try{localStorage.removeItem(k)}catch(e){}}
function saved(){try{return JSON.parse(get(PK)||"null")}catch(e){return null}}
var ok=!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
async function prfKey(id){
  var a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),userVerification:"required",
    allowCredentials:[{type:"public-key",id:u8(id)}],extensions:{prf:{eval:{first:SALT}}}}});
  var r=a.getClientExtensionResults().prf;if(!r||!r.results||!r.results.first)throw new Error("noprf");
  return crypto.subtle.importKey("raw",r.results.first,"AES-GCM",false,["encrypt","decrypt"]);
}
async function enroll(pw){
  var c=await navigator.credentials.create({publicKey:{rp:{name:NAME},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:NAME,displayName:NAME+" (Anthony Suggs)"},
    challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{residentKey:"preferred",userVerification:"required"},extensions:{prf:{eval:{first:SALT}}}}});
  var ext=c.getClientExtensionResults().prf;if(ext&&ext.enabled===false)throw new Error("noprf");
  var id=b64(c.rawId),key;
  if(ext&&ext.results&&ext.results.first)key=await crypto.subtle.importKey("raw",ext.results.first,"AES-GCM",false,["encrypt"]);
  else key=await prfKey(id);
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(pw));
  set(PK,JSON.stringify({id:id,iv:b64(iv),ct:b64(ct)}));
  if(REM)del(REM);            /* Face ID replaces the plain "remember" copy of the password */
}

var typed=null;

  if(!ok||saved()||get(PK+"no")==="1"||!pw)return;
  var box=document.getElementById("bioask");box.hidden=false;
  document.getElementById("biono").onclick=function(){box.hidden=true;set(PK+"no","1")};
  document.getElementById("bioyes").onclick=async function(){var m=document.getElementById("biomsg");m.textContent="Follow the Face ID / fingerprint prompt…";
    try{await enroll(pw);m.textContent="Done. Next time tap “Unlock with Face ID / fingerprint”.";setTimeout(function(){box.hidden=true},2500)}
    catch(e){m.textContent=e&&e.message==="noprf"?"This browser can't do it yet. Update iOS / Chrome, or let your phone save the password (it fills with Face ID).":"Didn't finish. You can try again next time.";
      setTimeout(function(){box.hidden=true},6000)}};
}
new MutationObserver(function(){if(unlocked())offer()}).observe(gate,{attributes:true,attributeFilter:["hidden","style"]});
if(unlocked())offer();
/* Unlock button on the lock screen once a passkey is saved */
if(ok&&saved()){
  var b=document.createElement("button");b.type="button";b.textContent="Unlock with Face ID / fingerprint";
  b.style.cssText="display:block;width:100%;margin:0 0 12px;padding:13px;border-radius:11px;border:0;background:#2f6fed;color:#fff;font-weight:600;font-size:16px";
  form.insertBefore(b,form.firstChild);
  b.onclick=async function(){
    try{var s=saved(),key=await prfKey(s.id);
      pwEl.value=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(s.iv)},key,u8(s.ct)));
      var rem=document.getElementById("rem");if(rem)rem.checked=false;
      typed=pwEl.value;form.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}));}
    catch(e){var err=document.getElementById("err");if(err)err.textContent="Face ID / fingerprint didn't work. Use the password (you can turn it on again after).";
      if(e&&(e.name==="OperationError"||e.message==="noprf")){del(PK);b.remove()}}};
}
})();
</script>
