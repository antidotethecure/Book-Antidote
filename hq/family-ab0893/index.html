<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suggs Family Guide">
<title>Suggs Family Guide</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--muted:#5d6570;--line:#e2e5ea;--accent:#1f4fd1;--risk:#b42318;--riskbg:#fdf0ee;--tag:#eef2fb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e9ecf1;--muted:#99a1ad;--line:#2a2f38;--accent:#7aa2ff;--risk:#ff8a7a;--riskbg:#2a1715;--tag:#1d2433}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{border:0;background:none;color:var(--accent);font-size:17px;padding:4px 6px 4px 0;cursor:pointer;visibility:hidden}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px}
.gate h2{margin:0 0 4px;font-size:20px}.gate p{margin:0 0 16px;color:var(--muted);font-size:14px}
.gate input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gate button{margin-top:12px;width:100%;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
#err{color:var(--risk);font-size:14px;min-height:20px;margin-top:8px}
.list{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink)}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--tag);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;color:var(--accent)}
.tile.risk .ic{background:var(--riskbg);color:var(--risk)}
.tile b{display:block;font-size:16px}.tile span{color:var(--muted);font-size:13px}
.tile .chev{margin-left:auto;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.card h3{margin:.2em 0 .5em;font-size:16px}
.muted{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
.kv th{width:30%;color:var(--muted);font-weight:600}
.tl td:first-child{white-space:nowrap;color:var(--muted);width:30%}
.cases td:first-child{width:34%}
.tag{display:inline-block;background:var(--tag);color:var(--accent);font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-bottom:3px}
.quote{border-left:3px solid var(--accent);padding:8px 12px;margin:0 0 12px;background:var(--card);border-radius:0 10px 10px 0}
.quote.risk{border-color:var(--risk);background:var(--riskbg)}
.quote .d{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
figure{margin:0 0 12px}
figure img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;border-radius:10px;padding:12px;margin-bottom:12px;border:0;width:100%;font-size:16px;cursor:pointer}
.lnk{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;text-decoration:none}
.lnk b{color:var(--accent)}.lnk span{display:block;color:var(--muted);font-size:13px}
ol,ul{padding-left:20px;margin:.3em 0}li{margin:.3em 0}
.urgent li{margin-bottom:.7em}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
#zoom img{width:100%;max-width:900px;display:block;margin:0 auto;padding:env(safe-area-inset-top) 0 0}
#zoom button{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;font-size:16px;padding:8px 14px;border-radius:20px;border:0;background:#fff;color:#000;font-weight:600}
.foot{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="gate" class="gate"><form id="f" autocomplete="off">
<h2>Family guide: Anthony Suggs</h2>
<p>Private. Enter the password you were given.</p>
<input id="pw" type="password" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false">
<button type="submit" id="go">Open</button>
<div id="err"></div>
</form></div>
<div id="app" hidden>
<header><button id="back" aria-label="Back">‹ Back</button><h1 id="ttl">Case file</h1></header>
<div class="wrap" id="main"></div>
</div>

let DATA=null;
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(ENC.i)},key,u8(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const err=document.getElementById("err"),go=document.getElementById("go");
  err.textContent="";go.textContent="Opening…";go.disabled=true;
  try{DATA=await unlock(document.getElementById("pw").value);
    try{sessionStorage.setItem("pdk",document.getElementById("pw").value)}catch(_){}
    start();}
  catch(_){err.textContent="Wrong password. Try again.";}
  go.textContent="Open";go.disabled=false;
});
(async()=>{let k=null;try{k=sessionStorage.getItem("pdk")}catch(_){}
  if(k){try{DATA=await unlock(k);start();}catch(_){}}})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function start(){document.getElementById("gate").hidden=true;document.getElementById("gate").style.display="none";
  document.getElementById("app").hidden=false;window.addEventListener("hashchange",route);route();}
const SAY='<button class="btn" id="say" onclick="sayPage()">🔊 Read this page out loud</button>';
let speaking=false;
function sayPage(){const b=document.getElementById("say");
  if(!("speechSynthesis" in window)){b.textContent="Read-aloud isn't supported on this device";return;}
  if(speaking){speechSynthesis.cancel();speaking=false;b.textContent="🔊 Read this page out loud";return;}
  const t=[...document.querySelectorAll("#main .card, #main .lnk")].map(e=>e.innerText).join(". ");
  const parts=t.replace(/\s+/g," ").match(/[^.!?]+[.!?]*/g)||[];
  speechSynthesis.cancel();speaking=true;b.textContent="■ Stop reading";
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.rate=0.95;u.lang="en-US";
    if(i===parts.length-1)u.onend=()=>{speaking=false;const x=document.getElementById("say");if(x)x.textContent="🔊 Read this page out loud";};
    speechSynthesis.speak(u);});}
window.addEventListener("hashchange",()=>{try{speechSynthesis.cancel()}catch(_){}speaking=false;});
function route(){
  const id=location.hash.slice(1),main=document.getElementById("main"),back=document.getElementById("back"),ttl=document.getElementById("ttl");
  const s=DATA.sections.find(x=>x.id===id);window.scrollTo(0,0);
  if(!s){ttl.textContent="Family guide: Anthony Suggs";back.style.visibility="hidden";
    main.innerHTML='<div class="list">'+DATA.sections.map(x=>`<a class="tile${x.id==="risks"?" risk":""}" href="#${x.id}"><div class="ic">${esc(x.icon)}</div><div><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></div><div class="chev">›</div></a>`).join("")+
    `</div><div class="foot">Private family guide · updated ${esc(DATA.built)}</div>`;return;}
  ttl.textContent=s.title;back.style.visibility="visible";
  main.innerHTML=SAY+s.items.map((it,i)=>{
    if(it.t==="html")return `<div class="card">${it.html}</div>`;
    if(it.t==="img")return `<figure><img loading="lazy" src="${it.src}" alt="${esc(it.cap)}" onclick="zoomOn(this.src)"><figcaption>${esc(it.cap)}</figcaption></figure>`;
    if(it.t==="quote")return `<div class="quote${it.flag==="risk"?" risk":""}"><div class="d">${esc(it.date)}</div>“${esc(it.text)}”</div>`;
    if(it.t==="link")return `<a class="lnk" href="${esc(it.url)}" target="_blank" rel="noopener"><b>${esc(it.label)} ↗</b><span>${esc(it.note)}</span></a>`;
    if(it.t==="pdf")return `<button class="btn" onclick="openPdf('${s.id}',${i})">${esc(it.label)}</button>`;
    return "";}).join("")+`<div class="foot"><a href="#">‹ All sections</a></div>`;
}
document.getElementById("back").onclick=()=>{location.hash="";};
function openPdf(sid,i){const it=DATA.sections.find(x=>x.id===sid).items[i];
  const url=URL.createObjectURL(new Blob([u8(it.data)],{type:"application/pdf"}));
  const w=window.open(url,"_blank");if(!w)location.href=url;}
function zoomOn(src){const z=document.getElementById("zoom");z.querySelector("img").src=src;z.style.display="block";}
function zoomOff(){document.getElementById("zoom").style.display="none";}
</script>
