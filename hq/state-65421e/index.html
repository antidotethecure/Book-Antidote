<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suggs Case Files">
<title>Suggs Case Files</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--muted:#5d6570;--line:#e2e5ea;--accent:#1f4fd1;--risk:#b42318;--riskbg:#fdf0ee;--tag:#eef2fb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e9ecf1;--muted:#99a1ad;--line:#2a2f38;--accent:#7aa2ff;--risk:#ff8a7a;--riskbg:#2a1715;--tag:#1d2433}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{border:0;background:none;color:var(--accent);font-size:17px;padding:4px 6px 4px 0;cursor:pointer;visibility:hidden}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px}
.gate h2{margin:0 0 4px;font-size:20px}.gate p{margin:0 0 16px;color:var(--muted);font-size:14px}
.gate input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gate button{margin-top:12px;width:100%;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
#err{color:var(--risk);font-size:14px;min-height:20px;margin-top:8px}
.list{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink)}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--tag);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;color:var(--accent)}
.tile.risk .ic{background:var(--riskbg);color:var(--risk)}
.tile b{display:block;font-size:16px}.tile span{color:var(--muted);font-size:13px}
.tile .chev{margin-left:auto;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.card h3{margin:.2em 0 .5em;font-size:16px}
.muted{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
.kv th{width:30%;color:var(--muted);font-weight:600}
.tl td:first-child{white-space:nowrap;color:var(--muted);width:30%}
.cases td:first-child{width:34%}
.tag{display:inline-block;background:var(--tag);color:var(--accent);font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-bottom:3px}
.quote{border-left:3px solid var(--accent);padding:8px 12px;margin:0 0 12px;background:var(--card);border-radius:0 10px 10px 0}
.quote.risk{border-color:var(--risk);background:var(--riskbg)}
.quote .d{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
figure{margin:0 0 12px}
figure img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;border-radius:10px;padding:12px;margin-bottom:12px;border:0;width:100%;font-size:16px;cursor:pointer}
.lnk{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;text-decoration:none}
.lnk b{color:var(--accent)}.lnk span{display:block;color:var(--muted);font-size:13px}
ol,ul{padding-left:20px;margin:.3em 0}li{margin:.3em 0}
.urgent li{margin-bottom:.7em}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
#zoom img{width:100%;max-width:900px;display:block;margin:0 auto;padding:env(safe-area-inset-top) 0 0}
#zoom button{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;font-size:16px;padding:8px 14px;border-radius:20px;border:0;background:#fff;color:#000;font-weight:600}
.foot{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="gate" class="gate"><form id="f" autocomplete="on">
<h2>Case files: Anthony Suggs</h2>
<p>Confidential, prepared for defense counsel. Enter the password you were given.</p>
<button type="button" id="bio" hidden style="margin-bottom:12px">Unlock with Face ID / fingerprint</button>
<input type="text" name="username" autocomplete="username" value="Case files" hidden readonly>
<input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false">
<label id="biowrap" style="display:none;gap:8px;align-items:center;margin:10px 0 2px;font-size:15px"><input type="checkbox" id="bioon" checked style="width:20px;height:20px"> Turn on Face ID / fingerprint for next time</label>
<button type="submit" id="go">Open</button>
<div id="err"></div>
</form></div>
<div id="bioask" hidden style="position:fixed;left:12px;right:12px;bottom:12px;z-index:50;background:var(--card,#1c2333);color:inherit;border:1px solid #3a4560;border-radius:14px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)">
<b>Open with Face ID or fingerprint next time?</b><p style="margin:6px 0 10px;font-size:14px">Saves a passkey on this device only. The password still works everywhere.</p>
<button type="button" id="bioyes">Turn on</button> <button type="button" id="biono" style="background:transparent;border:1px solid #3a4560">Not now</button><div id="biomsg" style="font-size:13px;margin-top:8px"></div></div>
<div id="app" hidden>
<header><button id="back" aria-label="Back">‹ Back</button><h1 id="ttl">Case file</h1></header>
<div class="wrap" id="main"></div>
</div>
<div id="zoom"><button onclick="zoomOff()">Close</button><img alt=""></div>

let DATA=null,KEY=null;
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(ENC.i)},key,u8(ENC.c));KEY=key;
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const err=document.getElementById("err"),go=document.getElementById("go");
  const pw=document.getElementById("pw").value;err.textContent="";go.disabled=true;
  /* Face ID setup happens HERE, before the big file is decrypted: on iPhone the passkey sheet over a fully
     opened 16 MB file can make Safari reload the tab, which looped people back to this screen. */
  let bioKey=null,bioId=null,bioMsg="";
  const wrap=document.getElementById("biowrap"),want=wrap.style.display!=="none"&&document.getElementById("bioon").checked;
  if(want||PEND){
    go.textContent="Face ID…";
    try{
      if(PEND){bioId=PEND;bioKey=await prfOut(PEND);PEND=null;}
      else{const c=await bioCreate();bioId=c.id;bioKey=c.key;
        if(!bioKey){PEND=c.id;go.textContent="Confirm with Face ID";go.disabled=false;
          err.textContent="One more tap: press “Confirm with Face ID” to finish setup.";return;}}
    }catch(x){PEND=null;bioMsg=x&&x.message==="noprf"?"Face ID isn't supported in this browser yet (update iOS, or open the link in Safari). Opened with the password.":"Face ID setup didn't finish. Opened with the password; you can try again next time.";}
  }
  go.textContent="Opening…";
  try{DATA=await unlock(pw);
    try{sessionStorage.setItem("pdk",pw)}catch(_){}
    if(bioKey){try{await bioSave(bioId,bioKey,pw);bioMsg="Face ID is on. Next time tap “Unlock with Face ID / fingerprint”.";}catch(_){bioMsg="Face ID setup didn't finish.";}}
    LASTPW=pw;start();if(bioMsg)toast(bioMsg);}
  catch(_){err.textContent="Wrong password. Try again.";}
  go.textContent="Open";go.disabled=false;
});
/* Private key link: ...#key=PASSWORD opens straight in. The part after # never reaches the server; it's read here,
   then removed from the address bar so it isn't left on screen or in history. */
let LINKKEY=null;{const m=location.hash.match(/^#key=(.+)$/);
  if(m){try{LINKKEY=decodeURIComponent(m[1])}catch(_){LINKKEY=m[1]}try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}}}
(async()=>{let k=LINKKEY;try{if(!k&&!/[?&]faceid/.test(location.search))k=sessionStorage.getItem("pdk")}catch(_){}
  if(k){try{DATA=await unlock(k);try{sessionStorage.setItem("pdk",k)}catch(_){}start();}catch(_){if(LINKKEY)document.getElementById("err").textContent="That link's key didn't work. Enter the password instead.";}}})();

/* Face ID / fingerprint: a passkey with the WebAuthn PRF extension. The passkey's secret (never leaves the device's
   secure hardware unless synced by iCloud/Google Keychain) wraps the password; only the wrapped copy is stored here. */
let LASTPW=null;const PK="caseBio1",SALT=new TextEncoder().encode("antidote-case-files-prf-v1");
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const bioGet=()=>{try{return JSON.parse(localStorage.getItem(PK)||"null")}catch(_){return null}};
const bioOK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
async function prfOut(id){
  const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),userVerification:"required",
    allowCredentials:[{type:"public-key",id:u8(id)}],extensions:{prf:{eval:{first:SALT}}}}});
  const r=a.getClientExtensionResults().prf;if(!r||!r.results||!r.results.first)throw new Error("noprf");
  return crypto.subtle.importKey("raw",r.results.first,"AES-GCM",false,["encrypt","decrypt"]);
}
let PEND=null;
async function bioCreate(){            /* make the passkey; returns {id,key} (key null if this phone needs a 2nd tap for PRF) */
  const c=await navigator.credentials.create({publicKey:{rp:{name:"Case files"},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"Case files",displayName:"Case files (Anthony Suggs)"},
    challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{residentKey:"preferred",userVerification:"required"},extensions:{prf:{eval:{first:SALT}}}}});
  const ext=c.getClientExtensionResults().prf;if(ext&&ext.enabled===false)throw new Error("noprf");
  const key=ext&&ext.results&&ext.results.first?await crypto.subtle.importKey("raw",ext.results.first,"AES-GCM",false,["encrypt","decrypt"]):null;
  return {id:b64(c.rawId),key};
}
async function bioSave(id,key,pw){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(pw));
  localStorage.setItem(PK,JSON.stringify({id,iv:b64(iv),ct:b64(ct)}));
}
function toast(m){const t=document.createElement("div");t.textContent=m;
  t.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:#1c2333;color:#fff;border:1px solid #3a4560;border-radius:14px;padding:14px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.35)";
  document.body.appendChild(t);setTimeout(()=>t.remove(),7000);}
async function bioEnroll(pw){
  const c=await navigator.credentials.create({publicKey:{rp:{name:"Case files"},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"Case files",displayName:"Case files (Anthony Suggs)"},
    challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{residentKey:"preferred",userVerification:"required"},extensions:{prf:{eval:{first:SALT}}}}});
  const ext=c.getClientExtensionResults().prf;if(ext&&ext.enabled===false)throw new Error("noprf");
  const id=b64(c.rawId);let key;
  if(ext&&ext.results&&ext.results.first)key=await crypto.subtle.importKey("raw",ext.results.first,"AES-GCM",false,["encrypt"]);
  else key=await prfOut(id);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(pw));
  localStorage.setItem(PK,JSON.stringify({id,iv:b64(iv),ct:b64(ct)}));
}
async function bioUnlock(){
  const s=bioGet();const key=await prfOut(s.id);
  const pw=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(s.iv)},key,u8(s.ct)));
  return unlock(pw);
}
function offerBio(){
  let no=false;try{no=localStorage.getItem(PK+"no")==="1"}catch(_){}
  if(!bioOK()||bioGet()||no||!LASTPW)return;
  const box=document.getElementById("bioask");box.hidden=false;
  document.getElementById("biono").onclick=()=>{box.hidden=true;try{localStorage.setItem(PK+"no","1")}catch(_){}};
  document.getElementById("bioyes").onclick=async()=>{const m=document.getElementById("biomsg");m.textContent="Follow the Face ID / fingerprint prompt…";
    try{await bioEnroll(LASTPW);m.textContent="Done. Next time tap “Unlock with Face ID / fingerprint”.";setTimeout(()=>box.hidden=true,2500);}
    catch(e){m.textContent=e&&e.message==="noprf"?"This browser can't do it yet. Update iOS / Chrome, or let your phone save the password instead (it fills with Face ID).":"Didn't finish. You can try again next time.";
      setTimeout(()=>box.hidden=true,6000);}};
}
/* ?faceid in the link = fresh Face ID setup on this phone: clear any half-finished or "Not now" state first. */
const FRESH=/[?&]faceid/.test(location.search);
if(FRESH){try{localStorage.removeItem(PK);localStorage.removeItem(PK+"no");sessionStorage.removeItem("pdk")}catch(_){}
  try{history.replaceState(null,"",location.pathname+location.hash)}catch(_){}}   /* clear once; a reload won't wipe the new Face ID */
{let no=false;try{no=localStorage.getItem(PK+"no")==="1"}catch(_){}
 if(bioOK()&&!bioGet()&&!no)document.getElementById("biowrap").style.display="flex";
 if(!bioOK()&&!FRESH){const n=document.createElement("p");n.style.cssText="font-size:13px;opacity:.75;margin:10px 0 0";
   n.textContent="Face ID unlock works in Safari or Chrome. This browser (for example DuckDuckGo or an in-app browser) can't do it, but your phone can still AutoFill the saved password with Face ID.";
   document.getElementById("err").after(n);}
 if(FRESH){const e=document.getElementById("err");
   if(!bioOK())e.textContent="This browser can't use Face ID. Open this link in Safari (not inside Instagram, Telegram, WhatsApp or Gmail).";
   else{const st=document.createElement("p");st.style.cssText="font-size:14px;margin:4px 0 0";
     st.textContent="Face ID setup: type the password, keep the box checked, tap Open, then follow the Face ID prompt.";
     document.getElementById("biowrap").after(st);
     if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(ok=>{
       if(!ok)e.textContent="Face ID / passcode isn't set up on this phone. Turn on Face ID and a passcode in Settings, and iCloud Keychain (Settings → your name → iCloud → Passwords), then reload.";});}}}
if(bioOK()&&bioGet()){const b=document.getElementById("bio");b.hidden=false;
  b.onclick=async()=>{const err=document.getElementById("err");err.textContent="";
    try{DATA=await bioUnlock();start();}
    catch(e){err.textContent="Face ID / fingerprint didn't work. Use the password (you can turn it on again after).";
      if(e&&(e.name==="OperationError"||e.message==="noprf")){try{localStorage.removeItem(PK)}catch(_){}b.hidden=true;}}};}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function start(){document.getElementById("gate").hidden=true;document.getElementById("gate").style.display="none";
  document.getElementById("app").hidden=false;window.addEventListener("hashchange",route);route();}
function tiles(list){return '<div class="list">'+list.map(x=>`<a class="tile${/risks$/.test(x.id)?" risk":""}" href="#${x.id}"><div class="ic">${esc(x.icon)}</div><div><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></div><div class="chev">›</div></a>`).join("")+'</div>';}
let UP="";
/* Web build: photos and PDFs are separate encrypted files in m/, loaded only when needed, so a phone never
   holds the whole 12 MB at once (that crashed Safari on older iPhones). */
let BLOBS=[];
async function media(name,mime){const r=await fetch("m/"+name);if(!r.ok)throw new Error("media "+r.status);
  const b=new Uint8Array(await r.arrayBuffer());
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},KEY,b.slice(12));
  const u=URL.createObjectURL(new Blob([pt],{type:mime}));BLOBS.push(u);return u;}
function hydrate(){
  const imgs=[...document.querySelectorAll("img[data-m]")];if(!imgs.length)return;
  const load=el=>{if(el.dataset.done)return;el.dataset.done=1;media(el.dataset.m,el.dataset.mime).then(u=>{el.src=u;el.style.minHeight="";el.style.background=""}).catch(()=>{el.alt="Couldn't load this image. Check your connection and reopen the section."});};
  if(!("IntersectionObserver" in window)){imgs.forEach(load);return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);load(e.target)}}),{rootMargin:"600px"});
  imgs.forEach(el=>io.observe(el));
}
function route(){
  BLOBS.forEach(u=>URL.revokeObjectURL(u));BLOBS=[];setTimeout(hydrate,0);
  const id=location.hash.slice(1),main=document.getElementById("main"),back=document.getElementById("back"),ttl=document.getElementById("ttl");
  window.scrollTo(0,0);
  const g=DATA.groups.find(x=>x.id===id);
  if(g){ttl.textContent=g.title;back.style.visibility="visible";UP="";
    main.innerHTML=(g.intro?`<div class="card">${g.intro}</div>`:"")+tiles(DATA.sections.filter(x=>"g-"+x.g===g.id))+`<div class="foot"><a href="#">‹ Both cases</a></div>`;return;}
  const s=DATA.sections.find(x=>x.id===id);
  if(!s){ttl.textContent="Case files: Anthony Suggs";back.style.visibility="hidden";UP="";
    main.innerHTML=`<div class="card"><p>One file for both of Anthony Suggs's cases. Tap a case to open its sections.</p></div>`+tiles(DATA.groups)+
    `<div class="foot">Confidential, prepared for defense counsel · updated ${esc(DATA.built)}</div>`;return;}
  const grp=DATA.groups.find(x=>x.id==="g-"+s.g);
  ttl.textContent=s.title;back.style.visibility="visible";UP=s.g;
  main.innerHTML=s.items.map((it,i)=>{
    if(it.t==="html")return `<div class="card">${it.html}</div>`;
    if(it.t==="img"&&it.m)return `<figure><img data-m="${esc(it.m)}" data-mime="${esc(it.mime||"image/jpeg")}" alt="${esc(it.cap)}" style="min-height:140px;background:rgba(128,128,128,.15)" onclick="this.src&&zoomOn(this.src)"><figcaption>${esc(it.cap)}</figcaption></figure>`;
    if(it.t==="img")return `<figure><img loading="lazy" src="${it.src}" alt="${esc(it.cap)}" onclick="zoomOn(this.src)"><figcaption>${esc(it.cap)}</figcaption></figure>`;
    if(it.t==="quote")return `<div class="quote${it.flag==="risk"?" risk":""}"><div class="d">${esc(it.date)}</div>“${esc(it.text)}”</div>`;
    if(it.t==="link")return `<a class="lnk" href="${esc(it.url)}" target="_blank" rel="noopener"><b>${esc(it.label)} ↗</b><span>${esc(it.note)}</span></a>`;
    if(it.t==="clock")return `<div class="card"><table class="tl">${it.rows.map(r=>{let left="";if(r.date){const d=Math.round((new Date(r.date+"T12:00:00")-new Date(new Date().toDateString()+" 12:00:00"))/864e5);left=d>0?`<b>${d} days left</b>`:d===0?"<b>Today</b>":`<span class="muted">${-d} days ago</span>`;}return `<tr><td>${r.date?new Date(r.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}):"<i>TBD</i>"}<br>${left}</td><td><b>${esc(r.label)}</b>${r.note?`<br><span class="muted">${esc(r.note)}</span>`:""}</td></tr>`;}).join("")}</table></div>`;
    if(it.t==="pdf")return `<button class="btn" onclick="openPdf('${s.id}',${i})">${esc(it.label)}</button>`;
    return "";}).join("")+`<div class="foot"><a href="#g-${s.g}">‹ ${esc(grp?grp.title:"Back")}</a></div>`;
}
document.getElementById("back").onclick=()=>{location.hash=UP?"g-"+UP:"";};
function openPdf(sid,i){const it=DATA.sections.find(x=>x.id===sid).items[i];
  if(it.m){const w=window.open("","_blank");
    media(it.m,"application/pdf").then(u=>{if(w)w.location.href=u;else location.href=u}).catch(()=>{if(w)w.close();toast("Couldn’t load the PDF. Check your connection.")});return;}
  const url=URL.createObjectURL(new Blob([u8(it.data)],{type:"application/pdf"}));
  const w=window.open(url,"_blank");if(!w)location.href=url;}
function zoomOn(src){const z=document.getElementById("zoom");z.querySelector("img").src=src;z.style.display="block";}
function zoomOff(){document.getElementById("zoom").style.display="none";}
</script>
