name: Drizzle Bowl assets
on:
  workflow_dispatch:
    inputs:
      glb_url:
        description: URL of the bowler scan (GLB)
        required: false
      atlas_url:
        description: URL of the crowd sprite sheet (WebP)
        required: false
      food_url:
        description: URL of the food cutout atlas (PNG, 4x2 cells with alpha)
        required: false
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the assets
        run: |
          mkdir -p drizzle-bowl/assets
          if [ -n "${{ github.event.inputs.glb_url }}" ]; then
            curl -fsSL "${{ github.event.inputs.glb_url }}" -o drizzle-bowl/assets/antidote.glb
          fi
          if [ -n "${{ github.event.inputs.atlas_url }}" ]; then
            curl -fsSL "${{ github.event.inputs.atlas_url }}" -o drizzle-bowl/assets/crowd.webp
          fi
          if [ -n "${{ github.event.inputs.food_url }}" ]; then
            curl -fsSL "${{ github.event.inputs.food_url }}" -o drizzle-bowl/assets/food.png
          fi
          ls -la drizzle-bowl/assets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle-bowl/assets
          git commit -m "Drizzle Bowl: mirror the scan, crowd sheet and food cutouts into assets" || echo "nothing to commit"
          git push
