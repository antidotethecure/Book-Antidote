name: Drizzle Bowl assets
on:
  workflow_dispatch:
    inputs:
      glb_url:
        description: URL of the bowler scan (GLB)
        required: true
      atlas_url:
        description: URL of the crowd sprite sheet (WebP)
        required: true
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the assets
        run: |
          mkdir -p drizzle-bowl/assets
          curl -fsSL "${{ github.event.inputs.glb_url }}" -o drizzle-bowl/assets/antidote.glb
          curl -fsSL "${{ github.event.inputs.atlas_url }}" -o drizzle-bowl/assets/crowd.webp
          ls -la drizzle-bowl/assets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle-bowl/assets
          git commit -m "Drizzle Bowl: mirror the bowler scan and crowd sheet into assets" || echo "nothing to commit"
          git push
