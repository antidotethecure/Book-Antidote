:root{--bg:#f4f5f7;--card:#fff;--ink:#111;--mut:#5a6270;--acc:#1f4fd1;--line:#d7dbe2}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b1f25;--ink:#eef0f3;--mut:#a3abb7;--acc:#7da2ff;--line:#2d333c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}h1{font-size:24px;margin:8px 0 0}h2{font-size:17px;margin:24px 0 8px}.sub{color:var(--mut);margin:2px 0 12px;font-size:14px}
.note{background:var(--card);border-left:4px solid var(--acc);padding:12px 14px;border-radius:8px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.q{font-weight:600;margin-bottom:8px}.n{color:var(--acc);margin-right:4px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
textarea{min-height:84px;resize:vertical}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mic{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-size:15px}.mic.rec{background:#d22}
.chk{display:flex;gap:10px;align-items:flex-start}.chk input{width:22px;height:22px;margin-top:2px}
.send{margin:18px 0 40px}.big{display:block;width:100%;padding:16px;font:inherit;font-size:18px;font-weight:700;border:0;border-radius:12px;background:var(--acc);color:#fff;margin-bottom:10px}
.big.alt{background:#2e7d32}.small{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit}
#lock{max-width:420px;margin:80px auto;padding:16px;text-align:center}
