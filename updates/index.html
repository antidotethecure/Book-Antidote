<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Updates</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#15151a;--mut:#6a6a76;--line:#e3e3df;--acc:#1F4FD8}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e12;--card:#17171d;--ink:#ededf2;--mut:#93939f;--line:#26262e;--acc:#7fa0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:640px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:1.35rem;margin:6px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:16px}
form{display:flex;flex-direction:column;gap:10px;margin-top:22px}
input[type=password]{padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
button{padding:13px;border-radius:11px;border:0;background:var(--acc);color:#fff;font-weight:650;font-size:16px;cursor:pointer}
.rm{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut)}
.err{color:#c0392b;font-size:.85rem;min-height:1.2em}
.day{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:26px 0 8px;font-weight:700}
.it{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:8px}
.it h3{margin:3px 0 4px;font-size:1rem;letter-spacing:-.01em}
.it p{margin:0;color:var(--mut);font-size:.9rem}
.area{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.lks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lk{font-size:.78rem;padding:6px 10px;border-radius:7px;border:1px solid var(--line);color:var(--ink);text-decoration:none}
.lock{font-size:.8rem;background:none;color:var(--mut);padding:6px 0;text-align:left;font-weight:500}
</style></head><body><div class="w">
<h1>Updates</h1>
<p class="sub">Everything Claude has built and changed, newest first. Updated 2026-09-29.</p>
<div id="gate"><form id="f">
<input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
<label class="rm"><input type="checkbox" id="rem"> Remember on this phone</label>
<button type="submit">Unlock</button><div class="err" id="err"></div></form></div>
<div id="log" hidden></div>
</div>

function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open_(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:D.n,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},key,b(D.c));
  return new TextDecoder().decode(pt);
}
async function show(pw,remember){
  var h=await open_(pw);
  var log=document.getElementById("log");
  log.innerHTML=h+'<button class="lock" id="lk">Lock this phone</button>';
  document.getElementById("gate").hidden=true; log.hidden=false;
  try{ if(remember) localStorage.setItem(K,pw) }catch(e){}
  document.getElementById("lk").onclick=function(){try{localStorage.removeItem(K)}catch(e){} location.reload()};
}
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault(); var err=document.getElementById("err"); err.textContent="Unlocking…";
  show(document.getElementById("pw").value,document.getElementById("rem").checked)
    .catch(function(){err.textContent="Wrong password."});
});
(function(){ var s=null; try{s=localStorage.getItem(K)}catch(e){}
  if(s) show(s,true).catch(function(){try{localStorage.removeItem(K)}catch(e){}}); })();
