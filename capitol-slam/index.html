const KEYS={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',KeyZ:'a',KeyJ:'a',KeyX:'b',KeyK:'b',KeyC:'sp',KeyL:'sp',KeyV:'tag',Space:'taunt',Enter:'start',Escape:'start'};
const held={},prev={},tap={};
const P=k=>!!tap[k]||(!!held[k]&&!prev[k]);
addEventListener('keydown',e=>{
  if(e.code==='KeyM'){toggleMute();return}
  const k=KEYS[e.code];if(!k)return;e.preventDefault();
  if(!held[k])tap[k]=1;held[k]=1;au();
});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)held[k]=0});
document.querySelectorAll('[data-b]').forEach(el=>{
  const k=el.dataset.b;
  const dn=e=>{e.preventDefault();held[k]=1;tap[k]=1;el.classList.add('on');au()};
  const up=e=>{e.preventDefault();held[k]=0;el.classList.remove('on')};
  el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const dp=document.getElementById('dpad');let dpId=null;
function dpSet(e){
  const r=dp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  const m=Math.hypot(x,y),dz=.1;let L=0,Rr=0,U=0,D=0;
  if(m>dz){const a=Math.atan2(y,x)*180/Math.PI; // 8-way
    Rr=a>-67.5&&a<67.5;L=a>112.5||a<-112.5;D=a>22.5&&a<157.5;U=a<-22.5&&a>-157.5;}
  for(const [k,v] of [['l',L],['r',Rr],['u',U],['d',D]]){if(v&&!held[k])tap[k]=1;held[k]=v?1:0}
}
dp.addEventListener('pointerdown',e=>{e.preventDefault();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId)}catch(_){}dpSet(e);au()});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e)});
const dpUp=e=>{if(e.pointerId===dpId){dpId=null;held.l=held.r=held.u=held.d=0}};
dp.addEventListener('pointerup',dpUp);dp.addEventListener('pointercancel',dpUp);

/* ---------------- layout ---------------- */
function fit(){
  const coarse=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
  const land=innerWidth>innerHeight;
  document.body.classList.toggle('touch',coarse);
  document.body.classList.toggle('land',coarse&&land);
  let aw=innerWidth,ah=innerHeight;
  if(coarse&&!land)ah-=Math.max(230,ah*0.36);
  else if(!coarse)ah-=40;
  let sc=Math.min(aw/W,ah/H);if(sc>=2&&!coarse)sc=Math.floor(sc);
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
}
addEventListener('resize',fit);fit();

/* ---------------- audio (WebAudio chiptune, all original) ---------------- */
let AC=null,master=null,muted=false,seq=null,song=null;
try{muted=localStorage.getItem('capslam_mute')==='1'}catch(_){}
function au(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination)}catch(_){return}}
  if(AC.state==='suspended')AC.resume();
  if(song&&!seq)playMusic(song);
}
function toggleMute(){muted=!muted;try{localStorage.setItem('capslam_mute',muted?'1':'0')}catch(_){}
  document.getElementById('mute').textContent=muted?'MUTED':'MUSIC'}
document.getElementById('mute').textContent=muted?'MUTED':'MUSIC';
const mf=n=>440*Math.pow(2,(n-69)/12);
function tone(f,dur,type='square',vol=.06,when=0,slide=0){
  if(!AC||muted)return;const t=AC.currentTime+Math.max(0,when);
  const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(master);o.start(t);o.stop(t+dur+.03);
}
let nbuf=null;
function noise(dur,vol=.1,when=0,freq=1000,q=.7){
  if(!AC||muted)return;
  if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
  const t=AC.currentTime+Math.max(0,when),s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=nbuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(gn).connect(master);s.start(t);s.stop(t+dur+.03);
}

function stopMusic(){if(seq){clearInterval(seq);seq=null}}
function playMusic(name){
  song=name;stopMusic();if(!AC)return;const S=SONGS[name];let step=0,next=AC.currentTime+.06;const spb=60/S.bpm/2;
  seq=setInterval(()=>{
    while(next<AC.currentTime+.15){
      const l=S.lead[step%S.lead.length],b=S.bass[step%S.bass.length],w=next-AC.currentTime;
      if(!muted){if(l)tone(mf(l),spb*.85,'square',.03,w);if(b)tone(mf(b),spb*.95,'triangle',.07,w);if(!S.once&&step%4===2)noise(.03,.03,w,6000)}
      step++;next+=spb;
      if(S.once&&step>=S.lead.length){stopMusic();song=null;return}
    }
  },25);
}

function persist(){try{localStorage.setItem('capslam',JSON.stringify(save))}catch(_){}}
let run={rung:0,allies:[],rec:3,pi:0};

/* ---------------- text ---------------- */
function txt(s,x,y,col='#fff',al='left',sz=8,sh='#000'){
  g.font=sz+"px 'Press Start 2P', monospace";g.textAlign=al;g.textBaseline='top';
  if(sh){g.fillStyle=sh;g.fillText(s,x+1,y+1)}g.fillStyle=col;g.fillText(s,x,y);
}
function wrap(s,n){const out=[];let line='';for(const w of s.split(' ')){if((line+' '+w).trim().length>n){if(line)out.push(line);line=w}else line=(line+' '+w).trim()}if(line)out.push(line);return out}
function box(x,y,w,h,bg='#0a0c24',bd='#fff'){g.fillStyle=bd;g.fillRect(x,y,w,h);g.fillStyle=bg;g.fillRect(x+2,y+2,w-4,h-4)}

/* ---------------- ring geometry ---------------- */
const TOP=100,BOT=200;
const leftAt=y=>lerp(48,20,(y-TOP)/(BOT-TOP)),rightAt=y=>lerp(208,236,(y-TOP)/(BOT-TOP));
function clampRing(f){f.y=clamp(f.y,106,194);f.x=clamp(f.x,leftAt(f.y)+8,rightAt(f.y)-8)}
function pline(x0,y0,x1,y1,col){g.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0;for(let i=0;i<=n;i++){const t=n?i/n:0;g.fillRect(Math.round(lerp(x0,x1,t)),Math.round(lerp(y0,y1,t)),1,1)}}

/* ---------------- fighters ---------------- */
function mkF(id,side,lvl){
  const c=C[id];let hp,pow,def,spd;
  if(side===0){
    if(id==='trump'){hp=c.hp;pow=c.pow;def=c.def;spd=c.spd}
    else{hp=125;pow=.97;def=.95;spd=(c.spd||1)*1.02}
  }else{hp=100+lvl*9+(c.boss?55:0);pow=.82+lvl*.035;def=.85+lvl*.025;spd=(c.spd||1)*(.88+lvl*.02)}
  return{id,c,side,x:0,y:150,z:0,vx:0,vz:0,face:1,st:'idle',t:0,dur:0,hp,max:hp,pow,def,spd,rally:0,fx:{},ai:{wait:0,dx:0,dy:0},cool:0,mv:null,hcd:0,hitDone:false,downDur:80};
}
let M=null;
const act=s=>M.teams[s].m[M.teams[s].a];
const foeOf=f=>act(1-f.side);
const human=f=>f.side===0&&!DEMO;
function idle(f){f.st='idle';f.t=0;f.z=0}
function start(f,st,dur=0){f.st=st;f.t=0;f.dur=dur}
function hittable(o){return o&&!['down','air','pin','pinned','away','getup','lock','tagout'].includes(o.st)&&!(o.fx.invul>0)}
function inFront(f,o,range,band=9){if(!o)return false;const dx=(o.x-f.x)*f.face;return Math.abs(o.y-f.y)<band&&dx>-5&&dx<range&&o.z<14}
function near(a,b,rx,ry){return b&&Math.abs(a.x-b.x)<rx&&Math.abs(a.y-b.y)<ry}
function downDur(o){const r=o.hp/o.max;if(o.hp<=0)return 260;return human(o)?Math.round(70+(1-r)*70):Math.round(80+(1-r)*70-M.d*30)}
function setDown(o,dur){o.st='down';o.t=0;o.z=0;o.dur=dur||downDur(o)}
function launch(o,vx,vz,dur){o.st='air';o.t=0;o.vx=vx;o.vz=vz;o.z=Math.max(o.z,1);o.downDur=dur||downDur(o)}

function hurt(a,o,dmg,opt={}){
  if(!o)return false;
  if(o.fx.counter>0&&!opt.unblockable){o.fx.counter=0;banner('AVIATOR COUNTER!','#7cf');idle(o);hurt(o,a,18,{launch:1,unblockable:1,special:1,lvx:o.face*1.8,lvz:5});return false}
  if(o.fx.mitten>0&&!opt.unblockable){SFX.grab();a.hp=Math.max(0,a.hp-4);popText(o,'MITTENED!','#fc6');if(['idle','walk','punch','kick','dash'].includes(a.st)){a.st='hit';a.t=0;a.dur=14;a.vx=-a.face*2.5}return false}
  if(o.c.shifty&&!opt.special&&!opt.unblockable&&rnd()<.15&&['idle','walk'].includes(o.st)){o.y+=o.y<150?16:-16;clampRing(o);popText(o,'SHIFTED!','#ccf');SFX.whiff();return false}
  let d=dmg*a.pow/o.def*(o.fx.defDown>0?1.3:1)*(.9+rnd()*.2);
  o.hp=Math.max(0,o.hp-d);
  a.rally=Math.min(100,a.rally+(opt.special?3:8));o.rally=Math.min(100,o.rally+3);
  M.crowd=Math.min(120,M.crowd+20);
  if(opt.launch)launch(o,opt.lvx!=null?opt.lvx:a.face*1.6,opt.lvz||4.5,opt.downDur);
  else if(opt.down||o.hp<=0)setDown(o,opt.downDur);
  else if(opt.stun){o.st='stun';o.t=0;o.dur=opt.stun}
  else{o.st='hit';o.t=0;o.dur=12;o.vx=a.face*(opt.knock||1.5)}
  for(let i=0;i<6;i++)M.parts.push({x:o.x,y:o.y-28*(o.c.h||1),vx:(rnd()-.5)*3,vy:-rnd()*2.5,life:20,col:pick(['#ff0','#fff','#fa0'])});
  if(d>=12){SFX.big();M.shake=5}else{SFX.hit();M.shake=2}
  return true;
}
function popText(f,s,col='#fff'){M.parts.push({x:f.x,y:f.y-52*(f.c.h||1),vx:0,vy:-.5,life:50,txt:s,col})}
function banner(s,col='#ff0'){M.bans.push({s,col,t:0})}
function say(f,s){M.bubs=M.bubs.filter(b=>b.f!==f);M.bubs.push({f,s,t:0})}

/* ---- grapple ---- */
function canLock(f,o){return o&&['idle','walk'].includes(o.st)&&f.cool===0&&o.cool===0&&Math.abs(o.x-f.x)<14&&Math.abs(o.y-f.y)<7&&!(o.fx.mitten>0)&&!(o.fx.invul>0)&&!(o.fx.counter>0)}
function startLock(f,o){
  M.lock={p:[f,o],s:[0,0],t:0,last:['a','a']};f.st=o.st='lock';f.t=o.t=0;o.face=-f.face;
  const mx=(f.x+o.x)/2;f.x=mx-f.face*7;o.x=mx+f.face*7;o.y=f.y;SFX.grab();
}
function updLock(){
  const L=M.lock;L.t++;
  for(let i=0;i<2;i++){const f=L.p[i];
    if(human(f)){if(P('a')){L.s[i]++;L.last[i]='a'}if(P('b')){L.s[i]++;L.last[i]='b'}}
    else{const rate=(.05+.12*(f.side===1?M.d:.6))*(f.fx.defDown>0?.7:1);if(rnd()<rate){L.s[i]++;L.last[i]=rnd()<.5?'a':'b'}}
  }
  if(L.s[0]>=10||L.s[1]>=10||L.t>=90){
    let w=L.s[0]===L.s[1]?(rnd()<.5?0:1):(L.s[0]>L.s[1]?0:1);
    const a=L.p[w],o=L.p[1-w],btn=L.last[w];M.lock=null;
    a.st='throw';a.t=0;a.dur=22;a.cool=o.cool=45;idle(o);o.face=-a.face;
    const nm=a.c.grab||['BODY SLAM','SUPLEX'];
    if(btn==='a'){banner(nm[0]);hurt(a,o,10,{launch:1,lvx:a.face*.9,lvz:4,unblockable:1})}
    else{banner(nm[1]);hurt(a,o,13,{launch:1,lvx:-a.face*1.3,lvz:5.5,unblockable:1})}
    a.rally=Math.min(100,a.rally+6);
  }
}

/* ---- pinfall ---- */
function tryPin(f,o){
  if(!o||o.st!=='down'||o.fx.invul>0)return false;
  f.st='pin';o.st='pinned';f.t=o.t=0;f.x=o.x+f.face*2;f.y=o.y;
  M.pin={a:f,o,c:0,t:0,mash:0};banner('PIN!','#fff');return true;
}
function updPin(){
  const p=M.pin,o=p.o,a=p.a;p.t++;
  M.ref.x=lerp(M.ref.x,o.x+14,.2);M.ref.y=lerp(M.ref.y,o.y-2,.2);
  if(human(o)){if(P('a')||P('b')){p.mash+=7;SFX.sel()}p.mash=Math.max(0,p.mash-.22);
    const thr=o.hp<=0?1e9:30+90*(1-o.hp/o.max)+25*M.d;
    if(p.mash>=thr)return kickout();
  }
  if(p.t%50===0){
    const k=p.t/50;
    if(!human(o)&&k>=2&&o.hp>0){
      const pr=clamp(o.hp/o.max*1.5+.2*M.d-(k-2)*.25,0,.95);
      if(rnd()<pr)return kickout();
    }
    p.c=k;SFX.count();M.parts.push({x:o.x,y:o.y-40,vx:0,vy:-.3,life:40,txt:String(k),col:'#fff',big:1});
    if(k>=3){M.pin=null;endMatch(a.side,o)}
  }
}
function kickout(){
  const p=M.pin,o=p.o,a=p.a;M.pin=null;banner('KICK OUT!','#f80');
  o.st='getup';o.t=0;o.fx.invul=50;a.st='hit';a.t=0;a.dur=16;a.vx=a.face*-2;a.cool=30;SFX.whiff();M.crowd=120;
}
function endMatch(side,loser){
  M.over={win:side,t:0};SFX.bell();SFX.cheer();
  const w=act(side);w.st='win';w.t=0;
  banner(side===0?'WINNER!':'PINNED!',side===0?'#ff0':'#f44');
}

/* ---- tag ---- */
function tryTag(f){
  const T=M.teams[f.side];
  if(T.m.length<2){if(human(f))popText(f,'NO PARTNER','#aaa');return}
  if(T.cd>0){if(human(f))popText(f,'WAIT...','#aaa');return}
  const n=T.m[1-T.a];T.a=1-T.a;
  n.x=f.x;n.y=f.y;n.z=0;n.st='idle';n.t=0;n.fx={invul:45};n.face=f.face;
  f.st='tagout';f.fx={};T.cd=360;
  banner('TAG! '+n.c.short+' IS IN!','#6f6');SFX.tag();M.crowd=120;
  if(f.side===0&&n.id!=='trump')say(n,'CROSSED THE AISLE!');
}

/* ---- specials ---- */
function special(f,downHeld){
  let mv=null,cost=0;
  if(f.rally>=100){mv=f.c.sp2;cost=100}
  else if(f.rally>=50){mv=(downHeld&&f.c.sp1d)||f.c.sp1;cost=50}
  else{if(human(f))popText(f,'NEED RALLY','#88f');return}
  f.rally-=cost;f.mv=mv;f.st='special';f.t=0;f.hitDone=false;
  banner(mv.n,f.side?'#f77':'#ff0');SFX.special();M.flash=4;
  const D={proj:24,spread:24,wall:18,fired:42,dash:8,melee:28,aoe:32,train:30,slide:22,heal:54,teleport:26,squad:30,puddle:26,lights:76,mitten:12,cancun:14,sleep:34,combo:48,clap:44,wipe:30,reverse:40,coconut:30,counter:mv.frames||90};
  f.dur=D[mv.type]||30;
  if(mv.type==='counter'){f.fx.counter=mv.frames}
  if(mv.type==='mitten'){f.fx.mitten=mv.frames;say(f,'I AM ONCE AGAIN ASKING...')}
}
function updSpecial(f,o){
  const mv=f.mv,t=f.t;
  switch(mv.type){
    case 'proj':if(t===10){M.proj.push({x:f.x+f.face*12,y:f.y,z:22,vx:f.face*3.2,vy:0,owner:f,spr:mv.spr,dmg:mv.dmg,stun:mv.stun,down:mv.down,life:120})}break;
    case 'spread':if(t===10)for(const vy of[-.55,0,.55])M.proj.push({x:f.x+f.face*12,y:f.y,z:24,vx:f.face*2.8,vy,owner:f,spr:mv.spr,dmg:mv.dmg,life:110});break;
    case 'wall':if(t===8){M.walls=M.walls.filter(w=>w.side!==f.side);M.walls.push({x:clamp(f.x+f.face*26,leftAt(f.y)+6,rightAt(f.y)-6),y:f.y,side:f.side,life:330});say(f,"AND MEXICO'S PAYING!");SFX.thud()}break;
    case 'fired':
      if(t===2)say(f,"YOU'RE FIRED!");
      if(t===14){if(inFront(f,o,32,12)&&hittable(o)){M.flash=14;M.shake=8;hurt(f,o,mv.dmg,{launch:1,lvx:f.face*2.6,lvz:6.5,downDur:200,special:1});M.crowd=120;SFX.cheer()}else{popText(f,'FAKE NEWS!','#f88');SFX.whiff()}}
      break;
    case 'dash':if(t===8){f.st='dash';f.t=0;f.vx=f.face*mv.spd;f.hitDone=false;f.hcd=0}break;
    case 'melee':if(t===12){if(inFront(f,o,mv.range,11)&&hittable(o))hurt(f,o,mv.dmg,{down:1,special:1});else SFX.whiff()}break;
    case 'aoe':
      if(t===14){for(let i=0;i<40;i++)M.parts.push({x:f.x,y:f.y-30,vx:(rnd()-.5)*5,vy:(rnd()-.8)*3,life:50,col:pick(['#fff','#eee','#f6c','#9cf']),sz:2,grav:.08});
        if(o&&hittable(o)&&Math.hypot(o.x-f.x,(o.y-f.y)*2)<mv.r)hurt(f,o,mv.dmg,{stun:mv.stun,special:1})}
      break;
    case 'train':if(t===12&&o){const fromL=o.x>128;M.proj.push({x:fromL?-30:W+30,y:o.y,z:0,vx:fromL?5:-5,vy:0,owner:f,spr:'train',dmg:mv.dmg,stun:mv.stun,life:200,big:1});say(f,'ALL ABOARD!')}break;
    case 'slide':if(t===6&&o){f.fx.invul=60;for(let i=0;i<8;i++)M.parts.push({x:f.x,y:f.y-20,vx:(rnd()-.5)*2,vy:-rnd(),life:24,col:'#9cf'});
      f.x=o.x-o.face*20;f.y=o.y;clampRing(f);f.face=o.x>f.x?1:-1;if(hittable(o)){o.st='stun';o.t=0;o.dur=40;popText(o,'HUH?','#fff')}}break;
    case 'heal':if(t===20){f.hp=Math.min(f.max,f.hp+mv.amt);popText(f,'+'+mv.amt+' HP','#6f6');for(let i=0;i<10;i++)M.parts.push({x:f.x+(rnd()-.5)*16,y:f.y-30,vx:0,vy:-.6-rnd(),life:40,col:'#f6a',heart:1})}break;
    case 'teleport':if(t===10&&o){for(let i=0;i<8;i++)M.parts.push({x:f.x,y:f.y-20,vx:(rnd()-.5)*3,vy:(rnd()-.5)*3,life:16,col:'#ccf'});
      f.x=o.x-o.face*14;f.y=o.y;clampRing(f);f.face=o.x>f.x?1:-1;if(hittable(o))hurt(f,o,mv.dmg,{special:1,knock:3})}break;
    case 'squad':if(t===10)[-12,0,12].forEach((dy,i)=>M.proj.push({x:f.x+f.face*10-f.face*i*14,y:clamp(f.y+dy,106,194),z:0,vx:f.face*3.4,vy:0,owner:f,spr:'squad',col:['#d24','#3a6','#e9b'][i],dmg:mv.dmg,life:110}));break;
    case 'puddle':if(t%6===0)M.parts.push({x:f.x+f.face*4,y:f.y-38,vx:f.face*.6,vy:.2,life:30,col:'#6cf',grav:.1});
      if(t===14&&o){M.pud.push({x:o.x,y:o.y,life:300,side:f.side,hit:new Set()});say(f,'*SNIFF*')}break;
    case 'lights':if(t===8){M.lights=80;if(o&&hittable(o)){o.st='stun';o.t=0;o.dur=70}}
      if(o&&(t===24||t===40||t===56)&&!['away','pin','pinned'].includes(o.st))hurt(f,o,mv.dmg/3,{stun:t<56?40:0,special:1,unblockable:1,down:t===56});break;
    case 'cancun':if(t===10){f.st='away';f.t=0;f.dur=150;f.hp=Math.min(f.max,f.hp+15);popText(f,'OFF TO CANCUN!','#ff8')}break;
    case 'sleep':if(t===4)say(f,'I DO NOT LIKE THEM, SAM I AM...');if(t===20&&o&&hittable(o)&&near(f,o,130,60)){o.st='asleep';o.t=0;o.dur=mv.frames;popText(o,'ZZZ','#aaf')}break;
    case 'combo':if(t%8===0&&t>0&&t<=40){if(t===8)say(f,'TALKING POINT! TALKING POINT!');if(inFront(f,o,22,10)&&hittable(o)||(o&&o.st==='hit'&&near(f,o,26,10)))hurt(f,o,mv.dmg,{special:1,knock:t===40?3:.6,down:t===40});}break;
    case 'clap':if(t===4)say(f,'PLEASE CLAP.');if(t===26){if(rnd()<.5){f.hp=Math.min(f.max,f.hp+15);popText(f,'*POLITE CLAPS*','#6f6');SFX.cheer()}else{popText(f,'*CRICKETS*','#aaa');SFX.boo();f.st='stun';f.t=0;f.dur=40}}break;
    case 'wipe':if(t===12){for(let i=0;i<14;i++)M.parts.push({x:f.x+f.face*10,y:f.y-24,vx:f.face*(1+rnd()*3),vy:(rnd()-.5)*2,life:30,col:'#fff',sz:2});say(f,'LIKE, WITH A CLOTH?');
      if(o&&hittable(o)&&Math.hypot(o.x-f.x,(o.y-f.y)*2)<mv.r){o.rally=0;popText(o,'RALLY WIPED!','#f66');hurt(f,o,mv.dmg,{stun:40,special:1})}}break;
    case 'reverse':if(t===10&&o){o.fx.rev=mv.frames;popText(o,'CONFUSED!','#f9f');for(const w of['UNBURDENED','VENN','SCHOOL BUS','SIGNIFICANCE','TIME'])M.parts.push({x:o.x+(rnd()-.5)*50,y:o.y-30-rnd()*30,vx:(rnd()-.5)*.6,vy:-.25,life:90,txt:w,col:pick(['#f9f','#9ff','#ff9']),sm:1})}break;
    case 'coconut':if(t===10&&o){say(f,'YOU THINK YOU JUST FELL OUT OF A COCONUT TREE?');for(let i=0;i<3;i++)M.coco.push({x:o.x,y:o.y,z:150,vz:0,delay:i*22,side:f.side,owner:f,dmg:mv.dmg,track:o})}break;
  }
  if(f.st==='special'&&f.t>=f.dur)idle(f);
}

/* ---- per-fighter update ---- */
function upd(f,inp){
  const o=foeOf(f);f.t++;
  for(const k in f.fx)if(f.fx[k]>0)f.fx[k]--;
  if(f.cool>0)f.cool--;
  if(f.fx.mitten>0&&f.hp>0)f.hp=Math.min(f.max,f.hp+.06);
  switch(f.st){
    case 'idle':case 'walk':{
      const px=f.x;let sp=f.spd*.95*(f.fx.mitten>0?.5:1);
      f.x+=inp.dx*sp;f.y+=inp.dy*sp*.62;f.st=(inp.dx||inp.dy)?'walk':'idle';
      clampRing(f);if(wallBlock(f,px))f.x=px;
      if(o&&!['away'].includes(o.st))f.face=o.x>=f.x?1:-1;
      if(o&&Math.abs(o.x-f.x)<8&&Math.abs(o.y-f.y)<5&&!['down','pinned','air'].includes(o.st)){f.x-=sgn(o.x-f.x||1)*.8;clampRing(f)}
      puddleCheck(f);if(f.st!=='idle'&&f.st!=='walk')break;
      const downNear=o&&o.st==='down'&&near(f,o,24,11);
      if(inp.a){if(downNear)start(f,'drop',30);else start(f,'punch',14)}
      else if(inp.b){if(!(downNear&&tryPin(f,o)))start(f,'kick',24)}
      else if(inp.sp)special(f,inp.dy>0);
      else if(inp.taunt)start(f,'taunt',50);
      else if(inp.tag)tryTag(f);
      else if(f.st==='walk'&&o&&inp.dx&&sgn(inp.dx)===f.face&&canLock(f,o))startLock(f,o);
      break;}
    case 'punch':if(f.t===5){if(inFront(f,o,19)&&hittable(o)){hurt(f,o,5);if(f.id==='trump'&&rnd()<.2)popText(f,'COVFEFE!','#ff8')}else SFX.whiff()}if(f.t>=f.dur)idle(f);break;
    case 'kick':if(f.t===9){if(inFront(f,o,25)&&hittable(o))hurt(f,o,7,{knock:3});else SFX.whiff()}if(f.t>=f.dur)idle(f);break;
    case 'drop':f.z=Math.sin(Math.min(f.t,22)/22*Math.PI)*16;
      if(f.t===22){f.z=0;if(o&&o.st==='down'&&near(f,o,24,12)){hurt(f,o,8,{down:1,downDur:o.dur-o.t+28});popText(f,'ELBOW DROP!','#ff8')}else SFX.thud()}
      if(f.t>=f.dur)idle(f);break;
    case 'hit':f.x+=f.vx;f.vx*=.85;clampRing(f);if(f.t>=f.dur)idle(f);break;
    case 'stun':case 'asleep':if(f.t>=f.dur)idle(f);break;
    case 'air':f.x+=f.vx;f.z+=f.vz;f.vz-=.35;clampRing(f);
      if(f.z<=0){f.z=0;setDown(f,f.downDur);SFX.thud();M.shake=4;for(let i=0;i<8;i++)M.parts.push({x:f.x+(rnd()-.5)*24,y:f.y,vx:(rnd()-.5)*1.5,vy:-rnd(),life:18,col:'#ddd'})}break;
    case 'down':if(human(f)&&(inp.a||inp.b))f.dur-=6;if(f.t>=f.dur){f.st='getup';f.t=0}break;
    case 'getup':f.fx.invul=Math.max(f.fx.invul||0,2);if(f.t>=18)idle(f);break;
    case 'taunt':

        if(f.id==='trump'&&o){say(f,o.c.nick+'!');o.fx.defDown=300;popText(o,'NICKNAMED!','#f80');f.rally=Math.min(100,f.rally+20)}
        else{say(f,f.c.taunt);f.rally=Math.min(100,f.rally+15);if(f.id==='pelosi'){f.hp=Math.min(f.max,f.hp+8);popText(f,'ICE CREAM +8','#6f6')}}
        M.crowd=100;

    case 'dash':{const mv=f.mv,px=f.x;f.x+=f.vx;clampRing(f);
      if(wallBlock(f,px)){f.x=px;f.st='stun';f.t=0;f.dur=40;f.hp=Math.max(0,f.hp-6);popText(f,'HIT THE WALL!','#fa8');SFX.thud();break}
      puddleCheck(f);if(f.st!=='dash')break;
      if(o&&hittable(o)&&inFront(f,o,16,10)){
        if(mv.multi){if(!(f.hcd>0)){hurt(f,o,mv.dmg*.35,{special:1,knock:2.5});f.hcd=10}}
        else if(!f.hitDone){f.hitDone=true;hurt(f,o,mv.dmg,{special:1,launch:!mv.stun,stun:mv.stun,lvx:f.face*1.8,lvz:4.5})}
      }
      if(f.hcd>0)f.hcd--;
      if(f.t>=mv.dur){if(mv.heal){f.hp=Math.min(f.max,f.hp+mv.heal);popText(f,'ICE CREAM +'+mv.heal,'#6f6')}idle(f)}
      break;}
    case 'special':updSpecial(f,o);break;
    case 'away':if(f.t>=f.dur&&o){
        f.y=o.y;f.x=o.x<128?rightAt(o.y)-10:leftAt(o.y)+10;f.face=o.x>f.x?1:-1;
        f.mv={type:'dash',dmg:12,spd:4.2,dur:32};f.st='dash';f.t=0;f.vx=f.face*4.2;f.hitDone=false;banner('BACK FROM CANCUN!','#ff8');
      }break;
    case 'throw':if(f.t>=f.dur)idle(f);break;
    case 'win':break;
  }
}
function wallBlock(f,px){
  for(const w of M.walls){if(w.side===f.side||Math.abs(f.y-w.y)>=14)continue;
    if((px<w.x)!==(f.x<w.x)||Math.abs(f.x-w.x)<5)return true}
  return false;
}
function puddleCheck(f){
  for(const p of M.pud){if(p.side===f.side||p.hit.has(f))continue;
    if(Math.abs(f.x-p.x)<15&&Math.abs(f.y-p.y)<7){p.hit.add(f);f.hp=Math.max(0,f.hp-4);setDown(f,50);popText(f,'SLIPPED!','#6cf');SFX.thud();return}}
}

/* ---- CPU brain ---- */
function useful(f,o){const mv=f.rally>=100?f.c.sp2:f.c.sp1,ady=Math.abs(o.y-f.y),adx=Math.abs(o.x-f.x);
  switch(mv.type){case 'proj':case 'dash':case 'spread':return ady<8&&(o.x-f.x)*f.face>0;case 'melee':case 'fired':return adx<28&&ady<10;case 'heal':return f.hp/f.max<.7;
    case 'counter':case 'mitten':return adx<45;case 'aoe':case 'wipe':return adx<50;default:return true}}
function ai(f,d){
  const o=foeOf(f),A=f.ai,inp={dx:0,dy:0,a:0,b:0,sp:0,tag:0,taunt:0};
  if(!o||!['idle','walk'].includes(f.st))return inp;
  if(f.c.naps&&rnd()<.0016){f.st='asleep';f.t=0;f.dur=75;popText(f,'ZZZ...','#aaf');return inp}
  if(A.wait>0){A.wait--;inp.dx=A.dx;inp.dy=A.dy;return inp}
  const dx=o.x-f.x,dy=o.y-f.y,adx=Math.abs(dx),ady=Math.abs(dy);let mx=0,my=0;
  const T=M.teams[f.side];
  if(T.m.length>1&&T.cd===0){const n=T.m[1-T.a];if(f.hp/f.max<.35&&n.hp/n.max>f.hp/f.max+.2&&rnd()<.5){inp.tag=1;return inp}}
  if(o.st==='down'){
    if(adx<22&&ady<10){if(!(o.fx.invul>0)&&rnd()<(o.hp/o.max<.5?.35+.5*d:.12+.3*d))inp.b=1;else inp.a=1;A.wait=12;return inp}
    mx=sgn(dx);my=ady>4?sgn(dy):0;
  }else if(['away','getup','air','tagout'].includes(o.st)){
    mx=sgn(128-f.x)*(Math.abs(128-f.x)>10?1:0);if(f.rally>=50&&rnd()<.1)inp.taunt=1;
  }else{
    if(f.rally>=100&&rnd()<.25+.4*d&&useful(f,o)){inp.sp=1;return inp}
    if(f.rally>=50&&f.rally<100&&rnd()<.08+.25*d&&useful(f,o)){inp.sp=1;return inp}
    if(ady>5)my=sgn(dy);
    if(adx>20)mx=sgn(dx);else if(adx<9&&rnd()<.5)mx=-sgn(dx);
    if(adx<23&&ady<8){const r=rnd();
      if(r<.3+.25*d)inp.a=1;else if(r<.45+.35*d)inp.b=1;else if(r<.62+.2*d)mx=sgn(dx)}
    if(f.hp/f.max<.3&&rnd()<.15)mx=-sgn(dx);
    if(rnd()<.006)inp.taunt=1;
  }
  if(f.fx.rev>0){if(rnd()<.6){mx=-mx;my=-my}inp.a=inp.b=0}
  A.dx=mx;A.dy=my;A.wait=Math.floor(14-10*d+rnd()*8);inp.dx=mx;inp.dy=my;return inp;
}
function playerInput(f){
  let dx=(held.r?1:0)-(held.l?1:0),dy=(held.d?1:0)-(held.u?1:0);
  if(f.fx.rev>0){dx=-dx;dy=-dy}
  return{dx,dy,a:P('a'),b:P('b'),sp:P('sp'),tag:P('tag'),taunt:P('taunt')};
}

/* ---------------- match ---------------- */
function startMatch(cfg){
  const lvl=cfg.lvl;
  M={cfg,teams:[{m:cfg.p.map(id=>mkF(id,0,lvl)),a:0,cd:0},{m:cfg.o.map(id=>mkF(id,1,lvl)),a:0,cd:0}],
    d:cfg.d!=null?cfg.d:clamp(.12+lvl*.065,0,.97),proj:[],walls:[],pud:[],coco:[],parts:[],bans:[],bubs:[],lock:null,pin:null,over:null,
    ref:{x:128,y:118,tx:128,ty:118},shake:0,lights:0,flash:0,frame:0,crowd:60,intro:100};
  const a=act(0),b=act(1);a.x=86;a.y=158;a.face=1;b.x=170;b.y=148;b.face=-1;
  scene='fight';playMusic('fight');SFX.bell();banner(cfg.label||'RING THE BELL!','#fff');
}
function stepFight(){
  M.frame++;
  if(M.shake>0)M.shake--;if(M.flash>0)M.flash--;if(M.lights>0)M.lights--;
  M.crowd=Math.max(0,M.crowd-.4);
  for(const T of M.teams){if(T.cd>0)T.cd--;T.m.forEach((m,i)=>{if(i!==T.a)m.hp=Math.min(m.max,m.hp+.03)})}
  if(M.intro>0){M.intro--;if(M.intro===0)banner('FIGHT!','#f44');tickFx();return}
  if(M.over){M.over.t++;const w=act(M.over.win);M.ref.x=lerp(M.ref.x,w.x+14,.1);M.ref.y=lerp(M.ref.y,w.y,.1);tickFx();
    if(M.over.t>170||(M.over.t>60&&(P('a')||P('start'))))matchDone(M.over.win===0);return}
  if(P('start')&&!DEMO){scene='pause';return}
  if(M.pin){updPin();tickFx();return}
  if(M.lock)updLock();
  for(let s=0;s<2;s++){const f=act(s);
    const inp=(s===0&&!DEMO)?playerInput(f):ai(f,s===1?M.d:.55);
    if(f.st!=='lock')upd(f,inp);
    if(M.pin||M.over)break;}
  // projectiles
  for(const p of M.proj){p.x+=p.vx;p.y+=p.vy;p.life--;if(p.vy)p.y=clamp(p.y,106,194);
    for(const w of M.walls)if(w.side!==p.owner.side&&Math.abs(p.x-w.x)<7&&Math.abs(p.y-w.y)<14&&!p.big){p.life=0;for(let i=0;i<5;i++)M.parts.push({x:w.x,y:w.y-20,vx:(rnd()-.5)*3,vy:-rnd()*2,life:14,col:'#fc8'});SFX.grab()}
    const o=act(1-p.owner.side);
    if(p.life>0&&hittable(o)&&Math.abs(p.x-o.x)<(p.big?18:10)&&Math.abs(p.y-o.y)<8){p.life=0;hurt(p.owner,o,p.dmg,{special:1,stun:p.stun,down:p.down,knock:2.5})}
    if(p.x<-40||p.x>W+40)p.life=0;}
  M.proj=M.proj.filter(p=>p.life>0);
  for(const w of M.walls)w.life--;M.walls=M.walls.filter(w=>w.life>0);
  for(const p of M.pud)p.life--;M.pud=M.pud.filter(p=>p.life>0);
  for(const c of M.coco){if(c.delay>0){c.delay--;if(c.track&&c.track.st!=='away'){c.x=c.track.x;c.y=c.track.y}continue}
    c.vz-=.25;c.z+=c.vz;const o=act(1-c.side);
    if(c.z<=18&&!c.done&&hittable(o)&&Math.abs(c.x-o.x)<11&&Math.abs(c.y-o.y)<8){c.done=1;hurt(c.owner,o,c.dmg,{special:1,stun:30});popText(o,'BONK!','#fc6')}
    if(c.z<=0){c.done=1;c.dead=1;if(!c.bonked){SFX.thud()}}}
  M.coco=M.coco.filter(c=>!c.dead);
  // ref wanders
  const r=M.ref;if(M.frame%120===0){r.tx=lerp(60,196,rnd());r.ty=lerp(110,130,rnd())}r.x=lerp(r.x,r.tx,.02);r.y=lerp(r.y,r.ty,.02);
  tickFx();
}
function tickFx(){
  for(const p of M.parts){p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=p.grav;p.life--}M.parts=M.parts.filter(p=>p.life>0);
  if(M.bans.length){M.bans[0].t++;if(M.bans[0].t>(M.bans.length>1?40:70))M.bans.shift()}
  for(const b of M.bubs)b.t++;M.bubs=M.bubs.filter(b=>b.t<80);
}
function matchDone(won){
  stopMusic();
  if(M.cfg.exh){scene='exh';playMusic('ladder');return}
  if(won){
    const L=LADDER[run.rung];
    const newAllies=L.opp.filter(id=>!run.allies.includes(id));
    run.allies.push(...newAllies);run.rung++;
    save.rung=run.rung;save.allies=run.allies.slice();
    if(run.rung>=LADDER.length){save.won=1;save.rung=0;save.allies=[];persist();goVictory();return}
    persist();
    S={t:0,allies:newAllies};scene='result';playMusic('win');
  }else{
    run.rec--;S={t:0,sel:0};scene=run.rec>=0?'recount':'gameover';SFX.boo();
  }
}

/* ---------------- drawing: fighters ---------------- */
let FR=0; // global frame for menus
function drawF(f,ox=0,oy=0,poseOverride){

    R(-9,-9,14,8,c.suit);if(c.shirt)R(-9,-6,14,2,c.shirt);if(c.tie)R(-7,-6,9,1,c.tie);
    R(-7,-11,10,2,c.suit);R(3,-11,3,2,hand);
    R(-19,-10,10,9,c.skin);
    const hc=c.hair;
    if(c.hs==='bernie'){R(-19,-11,3,2,hc);R(-19,-2,3,2,hc)}
    else if(c.hs==='trump'){R(-23,-11,5,11,hc);R(-18,-12,6,2,hc)}

    else{R(-21,-10,3,9,hc)}

    else{R(-14,-8,1,1,'#000');R(-14,-5,1,1,'#000')}
    if(c.aviators){R(-15,-9,2,3,'#111');R(-15,-6,2,3,'#111')}

  g.fillStyle='#3a5cd0';g.fillRect(0,0,128,H);g.fillStyle='#8a1a1a';g.fillRect(128,0,128,H);
  txt(L.rung,128,8,'#ff0','center');
  g.save();g.scale(2,2);drawF({...mkF('trump',0,0),x:32,y:84,face:1,st:'idle'});drawF({...mkF(L.opp[0],1,0),x:96,y:84,face:-1,st:'idle'});g.restore();
  if(L.opp[1]){g.save();g.scale(1,1);drawF({...mkF(L.opp[1],1,0),x:232,y:150,face:-1,st:'idle'});g.restore()}
  txt('VS',128,90,'#fff','center',16);
  txt('THE DONALD',64,176,'#ff0','center');
  txt(L.final?'SLEEPY JOE &':o.nick,192,176,'#ff0','center');
  txt(L.final?'LAFFIN\' KAMALA':o.name,W-4,188,L.final?'#ff0':'#ccc','right',8);
  if(!L.final)txt(o.office||'',W-4,198,'#9cf','right');
  box(8,206,240,30);const q=wrap('"'+o.quote+'"',28);q.slice(0,2).forEach((l,i)=>txt(l,14,212+i*10,'#fff','left',8,null));
  if(S.t>30&&(FR>>4)%2)txt('A',240,224,'#ff0','center',8,null);
}
function stepResult(){S.t++;if(S.t>40&&okP()){goLadder()}}
function drawResult(){g.fillStyle='#07081a';g.fillRect(0,0,W,H);
  txt('VICTORY!',128,20,'#ff0','center',16);
  const prevRung=LADDER[run.rung-1];txt(prevRung.rung+' IS YOURS',128,46,'#9cf','center');
  g.save();g.scale(2,2);drawF({...mkF('trump',0,0),x:64,y:90,face:1,st:'win',t:5});g.restore();
  S.allies.forEach((id,i)=>{txt(C[id].nick,128,190+i*12,'#6f6','center')});
  if(S.allies.length)txt('CROSSED THE AISLE! NEW TAG PARTNER',128,214,'#fff','center',8);
  if(S.t>40&&(FR>>4)%2)txt('PRESS A',128,228,'#ff0','center')}
function stepRecount(){S.t++;menuNav(2);if(S.t>30&&okP()){if(S.sel===0){SFX.ok();scene='vs';S={t:0}}else{scene='title';S={t:0,sel:0};playMusic('title')}}}
function drawRecount(){g.fillStyle='#1a0505';g.fillRect(0,0,W,H);txt('YOU GOT PINNED',128,40,'#f44','center',16);
  txt('RECOUNTS LEFT: '+run.rec,128,80,'#fff','center');
  ['DEMAND A RECOUNT','CONCEDE'].forEach((s,i)=>txt((S.sel===i?'> ':'  ')+s,64,120+i*16,S.sel===i?'#ff0':'#fff'));
  txt('"RIGGED!"',128,180,'#888','center')}
function stepGameOver(){S.t++;if(S.t>60&&okP()){save.rung=0;save.allies=[];persist();scene='title';S={t:0,sel:0};playMusic('title')}}
function drawGameOver(){g.fillStyle='#000';g.fillRect(0,0,W,H);txt('YOU CONCEDED',128,90,'#f44','center',16);txt('THE SWAMP WINS... THIS TIME.',128,120,'#aaa','center');if(S.t>60)txt('PRESS A',128,180,'#ff0','center')}
function goVictory(){scene='victory';S={t:0,fw:[]};playMusic('win')}
function stepVictory(){S.t++;if(S.t%14===0)for(let i=0;i<24;i++){const a=rnd()*7,sp=1+rnd()*1.5,x=40+rnd()*176,y=30+rnd()*50,col=pick(['#f44','#fff','#48f','#ff4']);S.fw.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:40,col})}
  for(const p of S.fw){p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.l--}S.fw=S.fw.filter(p=>p.l>0);
  if(S.t===200&&!song)playMusic('title');
  if(S.t>120&&okP()){scene='title';S={t:0,sel:0};playMusic('title')}}
function drawVictory(){
  g.fillStyle='#0a0a20';g.fillRect(0,0,W,H);for(const p of S.fw){g.fillStyle=p.col;g.fillRect(Math.round(p.x),Math.round(p.y),2,2)}
  // Oval Office
  g.fillStyle='#e8dcc0';g.fillRect(0,96,W,90);g.fillStyle='#c8b890';g.fillRect(0,186,W,54);
  g.fillStyle='#d4b46a';g.fillRect(96,104,64,40);g.fillStyle='#8ab8e8';g.fillRect(100,108,26,32);g.fillRect(130,108,26,32);
  g.fillStyle='#2346c8';g.fillRect(70,104,10,60);g.fillStyle='#d22';g.fillRect(176,104,10,60);
  g.save();g.scale(2,2);drawF({...mkF('trump',0,0),x:64,y:84,face:1,st:(FR%80<40)?'win':'taunt',t:5});g.restore();
  g.fillStyle='#5a3418';g.fillRect(68,150,120,30);g.fillStyle='#7a4a24';g.fillRect(64,146,128,6);g.fillStyle='#d4af37';g.beginPath();g.ellipse(128,165,10,7,0,0,7);g.fill();
  txt('YOU WON THE',128,14,'#fff','center');txt('WHITE HOUSE!',128,28,'#ff0','center',16);
  const credits=['THE CAST',...ALL.filter(k=>k!=='trump').map(k=>C[k].nick+' - '+C[k].name),'EXHIBITION MODE UNLOCKED!','THANKS FOR PLAYING'];
  const off=Math.max(0,S.t-160)/2;credits.forEach((s,i)=>{const y=Math.round(240+i*14-off);if(y>188&&y<236)txt(s,128,y,i===0||i>=credits.length-2?'#ff0':'#fff','center',8)});
  if(S.t>120&&(FR>>4)%2)txt('A: TITLE',W-6,6,'#888','right',8,null)}
function stepExh(){S.t++;menuNav(4);const ch=d=>{if(S.sel===0)S.p=(S.p+ALL.length+d)%ALL.length;if(S.sel===1)S.o=(S.o+ALL.length+d)%ALL.length;if(S.sel===2)S.l=clamp(S.l+d,0,13);SFX.sel()};
  if(P('l'))ch(-1);if(P('r'))ch(1);
  if(P('b')){scene='title';S={t:0,sel:0};playMusic('title');return}
  if(okP()&&S.sel===3){const ex=S;startMatch({p:[ALL[ex.p]],o:[ALL[ex.o]],lvl:ex.l,exh:1,label:'EXHIBITION!',label2:'EXHIBITION · LEVEL '+(ex.l+1)})}}
function drawExh(){
  g.fillStyle='#07081a';g.fillRect(0,0,W,H);txt('EXHIBITION',128,8,'#ff0','center',16);
  g.save();g.scale(2,2);drawF({...mkF(ALL[S.p],0,0),x:32,y:76,face:1,st:'idle'});drawF({...mkF(ALL[S.o],1,0),x:96,y:76,face:-1,st:'idle'});g.restore();
  txt('VS',128,100,'#f44','center',16);
  const rows=['YOU: '+C[ALL[S.p]].nick,'CPU: '+C[ALL[S.o]].nick,'LEVEL: '+(S.l+1)+'/14','FIGHT!'];
  rows.forEach((s,i)=>txt((S.sel===i?'> ':'  ')+(i<3?'< '+s+' >':s),8,170+i*12,S.sel===i?'#ff0':'#fff'));
  txt('B: BACK',W-6,226,'#888','right',8,null)}
function stepPause(){if(P('start')||P('a')){scene='fight'}if(P('b')){scene='title';S={t:0,sel:0};playMusic('title')}}

/* ---------------- main loop ---------------- */
function step(){
  FR++;
  switch(scene){
    case 'title':stepTitle();break;case 'help':stepHelp();break;case 'ladder':stepLadder();break;case 'vs':stepVs();break;
    case 'fight':stepFight();break;case 'pause':stepPause();break;case 'result':stepResult();break;case 'recount':stepRecount();break;
    case 'gameover':stepGameOver();break;case 'victory':stepVictory();break;case 'exh':stepExh();break;
  }
  for(const k in held)prev[k]=held[k];for(const k in tap)delete tap[k];
}
function render(){
  switch(scene){
    case 'title':drawTitle();break;case 'help':drawHelp();break;case 'ladder':drawLadder();break;case 'vs':drawVs();break;
    case 'fight':drawFight();break;case 'pause':drawFight();g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);txt('PAUSED',128,100,'#fff','center',16);txt('A: RESUME  B: QUIT',128,130,'#aaa','center');break;
    case 'result':drawResult();break;case 'recount':drawRecount();break;case 'gameover':drawGameOver();break;case 'victory':drawVictory();break;case 'exh':drawExh();break;
  }
}
let last=0,acc=0;const DT=1000/60,SPEED=QS.has('fast')?6:1;
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;acc+=Math.min(100,ts-last)*SPEED;last=ts;let n=0;while(acc>=DT&&n<12){step();acc-=DT;n++}if(n)render()}
S={t:0,sel:0,opp:'pelosi'};
if(DEMO){run={rung:+(QS.get('rung')||0),allies:[],rec:3,pi:0};const L=LADDER[run.rung];startMatch({p:['trump'],o:L.opp,lvl:run.rung,label:'DEMO'})}
(document.fonts&&document.fonts.load?document.fonts.load("8px 'Press Start 2P'"):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(loop));
window.__G={get M(){return M},get scene(){return scene},C,LADDER,run,special,act};
</script>
