<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Capitol Slam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#000;--ink:#fff;--red:#d81e28;--red2:#8e0f16;--pill:#24263a;--pill2:#3a3d58}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:'Press Start 2P',monospace}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top)}
#scr{display:block;background:#000;flex:none}
#hint{font-size:10px;color:#9aa0b8;margin-top:10px;text-align:center;line-height:1.8;padding:0 16px}
#pad{display:none;width:100%;max-width:520px;flex:1;min-height:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));position:relative}
body.touch #pad{display:flex;align-items:center;justify-content:space-between}
body.touch #hint{display:none}
#dpad{position:relative;width:148px;height:148px;flex:none;touch-action:none}
#dpad::before,#dpad::after{content:"";position:absolute;background:#2b2d40;border:3px solid #4a4d6a;border-radius:8px}
#dpad::before{left:50px;top:4px;width:48px;height:140px}
#dpad::after{top:50px;left:4px;height:48px;width:140px}
#dpad i{position:absolute;z-index:2;width:0;height:0;border:9px solid transparent;pointer-events:none}
#dpad .u{left:65px;top:14px;border-bottom-color:#9aa0c8}
#dpad .d{left:65px;bottom:14px;border-top-color:#9aa0c8}
#dpad .l{top:65px;left:14px;border-right-color:#9aa0c8}
#dpad .r{top:65px;right:14px;border-left-color:#9aa0c8}
#right{display:grid;grid-template-columns:repeat(3,auto);gap:10px;align-items:center;justify-items:center}
.btn{font-family:inherit;color:#fff;border:0;touch-action:none;cursor:pointer}
.big{width:66px;height:66px;border-radius:50%;background:var(--red);box-shadow:0 5px 0 var(--red2);font-size:18px}
.big.on{transform:translateY(4px);box-shadow:0 1px 0 var(--red2)}
.pill{height:34px;min-width:66px;border-radius:17px;background:var(--pill);border:2px solid var(--pill2);font-size:9px;padding:0 8px}
.pill.on{background:var(--pill2)}
.pill.sp{background:#1d3fae;border-color:#4d6fe0}
#top{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
#top .pill{height:28px;min-width:58px;font-size:8px}
#top #lockb{background:#3a2a10;border-color:#a8781e}
html.locked,html.locked body,#scr,#pad,#pad *{touch-action:none}
html.locked #lockb{background:#1e5a2a;border-color:#3cb050}
body.land #app{justify-content:center;padding-top:0}
body.land #pad{position:fixed;inset:0;max-width:none;pointer-events:none;padding:0}
body.land #dpad{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:18px;pointer-events:auto;opacity:.85}
body.land #right{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:18px;pointer-events:auto;opacity:.9}
body.land #top{top:auto;bottom:8px;pointer-events:auto}
</style>
</head>
<body>
<div id="app">
  <canvas id="scr" width="768" height="720" aria-label="Capitol Slam game screen"></canvas>
  <div id="hint">ARROWS move (double-tap = run) · Z punch · X kick/pin · C special (↓ alt) · V tag · SPACE taunt · ENTER start · M music</div>
  <div id="pad">
    <div id="top"><button class="btn pill" data-b="start">START</button><button class="btn pill" id="mute">MUSIC</button><button class="btn pill" id="lockb">UNLOCKED</button></div>
    <div id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <div id="right">
      <button class="btn pill" data-b="taunt">TAUNT</button>
      <button class="btn pill" data-b="tag">TAG</button>
      <button class="btn pill sp" data-b="sp">SPECIAL</button>
      <span></span>
      <button class="btn big" data-b="b">B</button>
      <button class="btn big" data-b="a">A</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= CAPITOL SLAM =================
   Political wrestling parody. Single file, no image assets: every wrestler, vehicle and crowd member is drawn
   from code (jointed skeleton + shaded shapes). World logic runs in 256x240 units; the canvas renders at 3x
   with a TV-style camera (zoom/pan/shake). */
const W=256,H=240,RS=3,TAU=Math.PI*2,PI=Math.PI;
const cv=document.getElementById('scr'),g=cv.getContext('2d');
const QS=new URLSearchParams(location.search);
const DEMO=QS.has('demo');            // both corners CPU (testing / attract)
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=Math.sign;
const pick=a=>a[Math.floor(rnd()*a.length)];
const ein=t=>t*t,eout=t=>1-(1-t)*(1-t),eio=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const s01=(k,a,b)=>clamp((k-a)/(b-a),0,1);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,s)=>[a[0]*s,a[1]*s],DIR=a=>[Math.sin(a),Math.cos(a)];
const SHC=new Map();
function shade(h,a){const k=h+'|'+a;let v=SHC.get(k);if(v)return v;let c=h.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');
  const n=[0,2,4].map(i=>parseInt(c.slice(i,i+2),16));const f=a<0?x=>Math.round(x*(1+a)):x=>Math.round(x+(255-x)*a);v='rgb('+n.map(f).join(',')+')';SHC.set(k,v);return v}
function ui(){g.setTransform(RS,0,0,RS,0,0)}

/* ---------------- input ---------------- */
const KEYS={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',KeyZ:'a',KeyJ:'a',KeyX:'b',KeyK:'b',KeyC:'sp',KeyL:'sp',KeyV:'tag',Space:'taunt',Enter:'start',Escape:'start'};
const held={},prev={},tap={};
const P=k=>!!tap[k]||(!!held[k]&&!prev[k]);
addEventListener('keydown',e=>{
  if(e.code==='KeyM'){toggleMute();return}
  const k=KEYS[e.code];if(!k)return;e.preventDefault();
  if(!held[k])tap[k]=1;held[k]=1;au();
});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)held[k]=0});
document.querySelectorAll('[data-b]').forEach(el=>{
  const k=el.dataset.b;
  const dn=e=>{e.preventDefault();held[k]=1;tap[k]=1;el.classList.add('on');au()};
  const up=e=>{e.preventDefault();held[k]=0;el.classList.remove('on')};
  el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const dp=document.getElementById('dpad');let dpId=null;
function dpSet(e){
  const r=dp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  const m=Math.hypot(x,y),dz=.1;let L=0,Rr=0,U=0,D=0;
  if(m>dz){const a=Math.atan2(y,x)*180/Math.PI;Rr=a>-67.5&&a<67.5;L=a>112.5||a<-112.5;D=a>22.5&&a<157.5;U=a<-22.5&&a>-157.5}
  for(const [k,v] of [['l',L],['r',Rr],['u',U],['d',D]]){if(v&&!held[k])tap[k]=1;held[k]=v?1:0}
}
dp.addEventListener('pointerdown',e=>{e.preventDefault();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId)}catch(_){}dpSet(e);au()});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e)});
const dpUp=e=>{if(e.pointerId===dpId){dpId=null;held.l=held.r=held.u=held.d=0}};
dp.addEventListener('pointerup',dpUp);dp.addEventListener('pointercancel',dpUp);
document.getElementById('mute').addEventListener('pointerdown',e=>{e.preventDefault();au();toggleMute()});
/* Screen lock: the first touch locks the page (no scroll, bounce, zoom or pull-to-refresh).
   The LOCKED button unlocks it (free mode) and stays free until it's tapped again. */
let scrLocked=false,scrFree=false;const lockb=document.getElementById('lockb');
function setLock(v){scrLocked=v;document.documentElement.classList.toggle('locked',v);lockb.textContent=v?'LOCKED':'UNLOCKED'}
lockb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(scrLocked){setLock(false);scrFree=true}else{scrFree=false;setLock(true)}});
document.addEventListener('touchstart',e=>{if(e.target===lockb)return;if(!scrLocked&&!scrFree)setLock(true)},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{if(e.cancelable&&(scrLocked||e.target.closest&&e.target.closest('#scr,#pad')))e.preventDefault()},{passive:false,capture:true});
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>{if(scrLocked)e.preventDefault()},{capture:true}));
document.addEventListener('dblclick',e=>{if(scrLocked)e.preventDefault()},{capture:true});
let lastDir={k:null,t:-99},runTap=null;

/* ---------------- layout ---------------- */
function fit(){
  const coarse=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
  const land=innerWidth>innerHeight;
  document.body.classList.toggle('touch',coarse);
  document.body.classList.toggle('land',coarse&&land);
  let aw=innerWidth,ah=innerHeight;
  if(coarse&&!land)ah-=Math.max(230,ah*0.36);else if(!coarse)ah-=40;
  const sc=Math.min(aw/W,ah/H);
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
}
addEventListener('resize',fit);fit();

/* ---------------- audio (WebAudio, all original) ---------------- */
let AC=null,master=null,muted=false,seq=null,song=null,crowdGain=null;
try{muted=localStorage.getItem('capslam_mute')==='1'}catch(_){}
function au(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);crowdStart()}catch(_){return}}
  if(AC.state==='suspended')AC.resume();
  if(wantTrack&&(!trackEl||trackEl.paused)&&trackOK){const w=wantTrack;playTrack(w.file,w.vol,w.at)}
  else if(song&&!seq)playMusic(song);
}
function toggleMute(){muted=!muted;if(trackGain)trackGain.gain.value=muted?0:trackVol;try{localStorage.setItem('capslam_mute',muted?'1':'0')}catch(_){}
  document.getElementById('mute').textContent=muted?'MUTED':'MUSIC'}
document.getElementById('mute').textContent=muted?'MUTED':'MUSIC';
const mf=n=>440*Math.pow(2,(n-69)/12);
function tone(f,dur,type='square',vol=.06,when=0,slide=0){
  if(!AC||muted)return;const t=AC.currentTime+Math.max(0,when);
  const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(master);o.start(t);o.stop(t+dur+.03);
}
let nbuf=null;
function nb(){if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}return nbuf}
function noise(dur,vol=.1,when=0,freq=1000,q=.7,type='bandpass'){
  if(!AC||muted)return;
  const t=AC.currentTime+Math.max(0,when),s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=nb();f.type=type;f.frequency.value=freq;f.Q.value=q;gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(gn).connect(master);s.start(t);s.stop(t+dur+.03);
}
function crowdStart(){try{const s=AC.createBufferSource();s.buffer=nb();s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;f.Q.value=.45;
  crowdGain=AC.createGain();crowdGain.gain.value=0;s.connect(f).connect(crowdGain).connect(master);s.start()}catch(_){}}
function crowdLevel(v){if(crowdGain&&AC)crowdGain.gain.setTargetAtTime(muted?0:v,AC.currentTime,.15)}
const SFX={
  hit(){noise(.09,.22,0,900);tone(140,.08,'square',.06,0,-70)},
  big(){noise(.25,.35,0,420);tone(95,.3,'square',.09,0,-50);tone(60,.35,'triangle',.25,0,-20)},
  whiff(){noise(.06,.05,0,3500)},
  thud(){tone(70,.25,'triangle',.3,0,-30);noise(.18,.2,0,250)},
  bell(){for(let i=0;i<3;i++){tone(1250,.5,'triangle',.12,i*.18);tone(1880,.35,'sine',.05,i*.18)}},
  special(){[0,4,7,12].forEach((n,i)=>tone(mf(72+n),.08,'square',.06,i*.05))},
  count(){noise(.07,.35,0,600);tone(200,.07,'square',.07)},
  tag(){tone(660,.06,'square',.06);tone(990,.08,'square',.06,.07)},
  sel(){tone(880,.04,'square',.05)},
  ok(){tone(660,.05,'square',.05);tone(1320,.08,'square',.05,.05)},
  cheer(){noise(1.1,.12,0,1600,.4);noise(.9,.08,.1,2600,.5)},
  ohh(){noise(.8,.1,0,600,.8);tone(180,.6,'sawtooth',.015,0,-60)},
  boo(){tone(150,.5,'sawtooth',.03,0,-40)},
  grab(){noise(.05,.15,0,400)},
  rope(){tone(110,.25,'sawtooth',.04,0,40);noise(.12,.08,0,300)},
  boom(){noise(1.2,.5,0,120,.5,'lowpass');tone(48,.9,'sine',.35,0,-20)},
  flash(){noise(.03,.03,0,7000)},
  crickets(){for(let i=0;i<6;i++)tone(4300,.03,'square',.012,i*.09+(i>2?.4:0))},
  horn(){tone(311,.7,'sawtooth',.05);tone(392,.7,'sawtooth',.04)},
  engine(){tone(52,1.2,'sawtooth',.05,0,25)},
  ding(){tone(2600,.18,'sine',.06);tone(2600,.18,'sine',.06,.2)},
  slam(){tone(52,.55,'sine',.55,0,-12);noise(.4,.5,0,160,.7,'lowpass');noise(.09,.45,0,1300,.9);tone(170,.6,'triangle',.07,.03,-50);noise(.6,.07,.03,330,14)},
  clang(){[1,2.76,5.4,8.9].forEach((m,i)=>tone(520*m,.5-i*.08,'sine',.09/(i+1)));noise(.12,.35,0,3200,2)},
  whack(){noise(.07,.45,0,2200,1.2);tone(300,.06,'square',.06,0,-150)},
  can(){[1,1.6,2.3].forEach(m=>tone(340*m,.35,'triangle',.06));noise(.2,.3,0,1800,3)},
  table(){noise(.5,.55,0,600,.6);for(let i=0;i<7;i++)noise(.04,.35,.03+i*.035,1400+rnd()*1800,4);tone(70,.4,'sine',.35,0,-20)},
  sting(){[60,63,67,72].forEach((n,i)=>tone(mf(n),.22,'sawtooth',.05,i*.09));noise(.4,.12,.36,900)},
};
const FORM={ah:[780,1150,2800],uh:[620,1050,2400],oh:[520,860,2500],eh:[560,1800,2500],oo:[380,820,2300]};
function voice(v,pitch,dur,vol=.5,when=0,glide=-.22){
  if(!AC||muted)return;const t=AC.currentTime+Math.max(0,when);
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(pitch,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,pitch*(1+glide)),t+dur);
  const out=AC.createGain();out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(vol,t+.025);out.gain.setValueAtTime(vol,t+dur*.6);out.gain.exponentialRampToValueAtTime(.0001,t+dur);
  FORM[v].forEach((f,i)=>{const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=i?10:6;const gg=AC.createGain();gg.gain.value=[2.2,1.4,.6][i];o.connect(bp).connect(gg).connect(out)});
  const ns=AC.createBufferSource();ns.buffer=nb();const nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1600;nf.Q.value=.8;const ng=AC.createGain();ng.gain.value=.25;ns.connect(nf).connect(ng).connect(out);
  out.connect(master);o.start(t);o.stop(t+dur+.05);ns.start(t,rnd());ns.stop(t+dur+.05);
}
const vp=c=>c.vp||(c.fem?215:118);
function grunt(f,big){if(!f||!f.c)return;const p=vp(f.c)*(.92+rnd()*.16);if(big)voice(pick(['ah','uh']),p*1.08,.42+rnd()*.15,.55,0,-.3);else voice(pick(['uh','ah','oh']),p,.13+rnd()*.08,.45,0,-.18)}
function yell(f){if(f&&f.c)voice(pick(['eh','ah']),vp(f.c)*1.15,.12,.3,0,.05)}
function crowdVox(v,n=7,when=0,vol=.05,dur=.32,glide=-.05){for(let i=0;i<n;i++)voice(v,110+rnd()*170,dur*(.85+rnd()*.3),vol,when+rnd()*.06,glide)}
function chant(){const pt=pick([['oo','eh','ah'],['eh','oh','ah','ah'],['ah','ah','eh']]);for(let r=0;r<2;r++)pt.forEach((v,i)=>{crowdVox(v,6,r*1.3+i*.33,.04,.26);noise(.05,.06,r*1.3+i*.33+.17,2600,.6)})}
/* Antidote's own songs (hosted on antidotethefoodie.com/audio) play under the crowd. Chiptune is the fallback. */
const SONG_DIR='../audio/',MATCH_SONGS=['energy.mp3','boom.mp3','bounce.mp3','cheat-code.mp3'],TRUMP_SONG='believe-me.m4a';
let trackEl=null,trackGain=null,trackVol=.3,trackOK=location.protocol!=='file:',wantTrack=null;
function playTrack(file,vol=.3,at=0){
  stopMusic();song=null;stopTrack();wantTrack=trackOK?{file,vol,at}:null;if(!trackOK)return false;if(!AC)return true;
  try{if(!trackEl){trackEl=new Audio();trackEl.preload='auto';trackEl.setAttribute('playsinline','');const src=AC.createMediaElementSource(trackEl);trackGain=AC.createGain();src.connect(trackGain).connect(master)}
    trackVol=vol;trackGain.gain.value=muted?0:vol;trackEl.src=SONG_DIR+file;trackEl.loop=true;
    trackEl.onloadedmetadata=()=>{try{if(at&&trackEl.duration>at+30)trackEl.currentTime=at}catch(_){}};
    trackEl.onerror=()=>{trackOK=false;if(scene==='fight')playMusic('fight');else if(scene==='entrance')playMusic('entrance')};
    const pr=trackEl.play();if(pr)pr.catch(()=>{});return true}catch(_){trackOK=false;return false}}
function stopTrack(){wantTrack=null;if(trackEl){try{trackEl.pause()}catch(_){}}}
const SONGS={
  title:{bpm:132,lead:[67,0,67,72,0,72,76,0,74,72,71,72,74,0,0,0,67,0,67,72,0,72,76,79,77,76,74,72,72,0,0,0],
         bass:[48,0,55,0,48,0,55,0,43,0,50,0,43,0,50,0,48,0,55,0,48,0,55,0,43,0,50,0,48,0,48,0]},
  fight:{bpm:150,lead:[69,0,72,69,76,0,74,72,69,0,72,74,76,79,76,74,67,0,71,67,74,0,72,71,69,0,0,69,72,74,76,0],
         bass:[45,45,57,45,45,45,57,45,41,41,53,41,41,41,53,41,43,43,55,43,43,43,55,43,45,45,57,45,40,40,52,40]},
  ladder:{bpm:110,lead:[60,64,67,72,0,67,72,76,0,0,74,72,71,0,67,0,62,65,69,74,0,69,74,77,0,0,76,74,72,0,0,0],
         bass:[36,0,43,0,36,0,43,0,43,0,50,0,43,0,50,0,38,0,45,0,38,0,45,0,43,0,50,0,48,0,0,0]},
  entrance:{bpm:128,lead:[64,0,64,67,0,64,0,62,64,0,0,0,0,0,0,0,64,0,64,67,0,69,0,67,64,0,62,0,60,0,0,0],
         bass:[40,40,40,40,40,40,43,43,40,40,40,40,38,38,38,38,40,40,40,40,40,40,43,43,45,45,43,43,40,40,40,40]},
  win:{bpm:140,once:1,lead:[72,72,72,76,0,79,0,0,77,76,74,72,79,0,0,0,84,0,0,0,0,0,0,0],bass:[48,48,48,52,0,55,0,0,53,0,50,0,55,0,0,0,48,0,0,0,0,0,0,0]},
};
function stopMusic(){if(seq){clearInterval(seq);seq=null}}
function playMusic(name){
  song=name;stopMusic();stopTrack();if(!AC||!name)return;const S=SONGS[name];let step=0,next=AC.currentTime+.06;const spb=60/S.bpm/2;
  seq=setInterval(()=>{
    while(next<AC.currentTime+.15){
      const l=S.lead[step%S.lead.length],b=S.bass[step%S.bass.length],w=next-AC.currentTime;
      if(!muted){if(l)tone(mf(l),spb*.85,'square',.026,w);if(b)tone(mf(b),spb*.95,name==='entrance'?'sawtooth':'triangle',name==='entrance'?.035:.07,w);if(!S.once&&step%4===2)noise(.03,.03,w,6000);if(name==='entrance'&&step%4===0)noise(.08,.08,w,150,.6,'lowpass')}
      step++;next+=spb;
      if(S.once&&step>=S.lead.length){stopMusic();song=null;return}
    }
  },25);
