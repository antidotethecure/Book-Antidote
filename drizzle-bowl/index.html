<script>
(function(){
  var API="https://drizzle-bowl-scores.higgsfield.app/api/scores";
  function wk(){var d=new Date();var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function fill(el,rows){el.innerHTML="";
    if(!rows||!rows.length){var d2=document.createElement("div");d2.className="sb-empty";d2.textContent="No scores yet - be the first!";el.appendChild(d2);return;}
    rows.slice(0,10).forEach(function(r,i){var li=document.createElement("li");
      var a=document.createElement("span");a.textContent=(i+1)+". "+String(r.name||"").slice(0,12);
      var b=document.createElement("span");b.textContent=r.score;
      li.appendChild(a);li.appendChild(b);el.appendChild(li);});}
  function refresh(){
    Promise.all([
      fetch(API+"?week="+wk()).then(function(r){return r.json();}),
      fetch(API).then(function(r){return r.json();})
    ]).then(function(res){
      fill(document.getElementById("sb-week"),res[0]);
      fill(document.getElementById("sb-all"),res[1]);
      document.getElementById("sb-weeklabel").textContent="Week of "+wk()+" - resets Monday";
      document.getElementById("sideboard").hidden=false;
    }).catch(function(){});
  }
  refresh();setInterval(refresh,45000);
})();
</script>

var crashBuf=null,crashLoading=false,lastCrash=0;
function loadCrash(){var a=ac();if(!a||crashBuf||crashLoading)return;crashLoading=true;
  try{var bin=atob(CRASH_B64),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    a.decodeAudioData(arr.buffer,function(b){crashBuf=b;},function(){crashBuf=null;});}catch(e){}}
function playCrash(vol,rate){var a=ac();if(!a)return false;loadCrash();if(!crashBuf)return false;
  var t=performance.now();if(t-lastCrash<90)return true;lastCrash=t;
  try{var s=a.createBufferSource(),v=a.createGain();s.buffer=crashBuf;s.playbackRate.value=rate||1;v.gain.value=vol||0.5;s.connect(v);v.connect(a.destination);s.start();return true;}catch(e){return false;}}

/* ---------- scoring ---------- */
function frameTotals(r){
  var out=[],i=0,run=0;
  for(var f=0;f<10;f++){
    if(i>=r.length){out.push(null);continue;}
    var s=null;
    if(r[i]===10){if(i+2<r.length)s=10+r[i+1]+r[i+2];i+=1;}
    else if(i+1<r.length&&r[i]+r[i+1]===10){if(i+2<r.length)s=10+r[i+2];i+=2;}
    else if(i+1<r.length){s=r[i]+r[i+1];i+=2;}
    else{i+=1;}
    if(s==null)out.push(null);else{run+=s;out.push(run);}
  }
  for(var k=1;k<10;k++)if(out[k-1]==null)out[k]=null;
  return out;
}
function frameMarks(){
  var r=g.rolls,i=0,res=[];
  for(var f=0;f<9;f++){var m=['',''];if(i<r.length){if(r[i]===10){m=['','X'];i++;}else{m[0]=r[i]===0?'-':String(r[i]);if(i+1<r.length)m[1]=r[i]+r[i+1]===10?'/':(r[i+1]===0?'-':String(r[i+1]));i+=2;}}res.push(m);}
  var t=r.slice(i),m3=['','',''];
  t.forEach(function(v,k){if(v===10)m3[k]='X';else if(k>0&&t[k-1]!==10&&t[k-1]+v===10)m3[k]='/';else m3[k]=v===0?'-':String(v);});
  res.push(m3);return res;
}
function total(){var t=frameTotals(g.rolls),v=0;for(var i=0;i<10;i++)if(t[i]!=null)v=t[i];return v;}

/* ---------- leaderboard ---------- */

/* ---------- strike / spare animations ---------- */
function easeOut(t){return 1-Math.pow(1-t,3);}
function drawTeeth(y,up,close){ /* one jaw: curved lip, gums, a row of teeth */
  var L=72,R=W-72,cx=W/2,curve=up?26:-26;
  /* lip + mouth interior behind it */
  ctx.fillStyle='#5a0f14';ctx.beginPath();ctx.moveTo(L,up?y-140:y+140);ctx.lineTo(R,up?y-140:y+140);ctx.lineTo(R,y);ctx.quadraticCurveTo(cx,y+curve*1.4,L,y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b8322c';ctx.beginPath();ctx.moveTo(L,up?y-26:y+26);ctx.lineTo(R,up?y-26:y+26);ctx.lineTo(R,y-curve*0.2);ctx.quadraticCurveTo(cx,y+curve*1.3,L,y-curve*0.2);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(L,up?y-26:y+26);ctx.lineTo(R,up?y-26:y+26);ctx.lineTo(R,up?y-18:y+18);ctx.lineTo(L,up?y-18:y+18);ctx.fill();
  /* tongue in the lower jaw */
  if(!up){ctx.fillStyle='#d8536a';ctx.beginPath();ctx.ellipse(cx,y+60,90,44,0,Math.PI,0);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.ellipse(cx-25,y+40,30,10,0,0,7);ctx.fill();}
  /* teeth follow the lip curve */
  var n=9,tw=(R-L)/n;
  for(var k=0;k<n;k++){var x=L+k*tw+2,f=(k+0.5)/n,lipY=y+curve*1.3*(1-Math.pow((f-0.5)*2,2));var tall=(k===3||k===5)?30:(k===4?26:22);if(k===0||k===n-1)tall=16;
    ctx.fillStyle='#fffbf0';if(up)rr(x,lipY-8,tw-4,tall,5);else rr(x,lipY-tall+8,tw-4,tall,5);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(x+1,up?lipY+tall-14:lipY-tall+8,tw-6,4);}
}
function drawClamp(t){
  /* jaws close from above and below the pin deck, hold, then open */
  var close=t<0.35?easeOut(t/0.35):t<0.8?1:1-easeOut((t-0.8)/0.7);
  var gap=170*(1-close)+8;
  var cy=250;
  ctx.save();ctx.beginPath();ctx.rect(72,0,W-144,TOP.h);ctx.clip();
  if(close>0.98){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(72,0,W-144,TOP.h);}
  drawTeeth(cy-gap/2,true,close);
  drawTeeth(cy+gap/2,false,close);
  /* crumbs flying at the bite */
  if(t>0.3&&t<0.9){ctx.fillStyle='#fbe9c4';for(var i=0;i<14;i++){var a=i*0.45+t*3,r=(t-0.3)*260;ctx.beginPath();ctx.arc(W/2+Math.cos(a)*r,cy+Math.sin(a)*r*0.5,3,0,7);ctx.fill();}}
  ctx.restore();
}
function drawDrizzle(t){
  /* a glossy amber stream pours from the heat lamps onto the pins */
  var x0=W/2,top=172,floor=318;
  var reach=Math.min(1,t/0.35);
  var yEnd=top+(floor-top)*easeOut(reach);
  var alive=t<1.7?1:1-(t-1.7)/0.5;
  ctx.save();ctx.globalAlpha=Math.max(0,alive);
  /* stream body — two passes: translucent amber, then a bright core */
  for(var pass=0;pass<2;pass++){
    ctx.beginPath();
    for(var y=top;y<=yEnd;y+=4){var f=(y-top)/(floor-top);var wob=Math.sin(y*0.09+t*14)*4*f;var w=(pass?2.2:6)+f*(pass?3:9);ctx.lineTo(x0+wob-w/2,y);}
    for(var y2=yEnd;y2>=top;y2-=4){var f2=(y2-top)/(floor-top);var wob2=Math.sin(y2*0.09+t*14)*4*f2;var w2=(pass?2.2:6)+f2*(pass?3:9);ctx.lineTo(x0+wob2+w2/2,y2);}
    ctx.closePath();
    if(pass){ctx.fillStyle='rgba(255,236,170,.85)';}else{var sg=ctx.createLinearGradient(x0-8,0,x0+8,0);sg.addColorStop(0,'rgba(184,50,44,.55)');sg.addColorStop(0.5,'rgba(242,168,29,.9)');sg.addColorStop(1,'rgba(184,50,44,.55)');ctx.fillStyle=sg;}
    ctx.fill();
  }
  /* puddle spreading on the deck */
  if(reach>=1){var pt=Math.min(1,(t-0.35)/1.2);var pw=20+pt*150,ph=6+pt*18;
    var pg=ctx.createRadialGradient(x0,floor,2,x0,floor,pw);pg.addColorStop(0,'rgba(255,220,120,.9)');pg.addColorStop(0.6,'rgba(242,168,29,.75)');pg.addColorStop(1,'rgba(184,50,44,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(x0,floor,pw,ph,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(x0-pw*0.3,floor-ph*0.3,pw*0.35,ph*0.25,0,0,7);ctx.fill();
    /* splash droplets */
    for(var i=0;i<10;i++){var a=i*0.63+t*2,rr2=(Math.sin(t*6+i)*0.5+0.5)*40+10;ctx.fillStyle=i%2?'#f2a81d':'#ffd166';ctx.beginPath();ctx.arc(x0+Math.cos(a)*rr2,floor-Math.abs(Math.sin(a))*rr2*0.6-4,2+i%3,0,7);ctx.fill();}
  }
  /* droplets breaking off the stream */
  for(var d=0;d<6;d++){var dy=top+((t*260+d*57)%(yEnd-top));var dx=x0+Math.sin(dy*0.09+t*14)*4*((dy-top)/(floor-top))+(d%2?9:-9);ctx.fillStyle='rgba(255,210,110,.9)';ctx.beginPath();ctx.ellipse(dx,dy,2,3.5,0,0,7);ctx.fill();}
  ctx.restore();
}
