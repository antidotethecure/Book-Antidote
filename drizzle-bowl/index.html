<script>
(function(){
  var API="https://drizzle-bowl-scores.higgsfield.app/api/scores";
  function wk(){var d=new Date();var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function fill(el,rows){el.innerHTML="";
    if(!rows||!rows.length){var d2=document.createElement("div");d2.className="sb-empty";d2.textContent="No scores yet - be the first!";el.appendChild(d2);return;}
    rows.slice(0,10).forEach(function(r,i){var li=document.createElement("li");
      var a=document.createElement("span");a.textContent=(i+1)+". "+String(r.name||"").slice(0,12);
      var b=document.createElement("span");b.textContent=r.score;
      li.appendChild(a);li.appendChild(b);el.appendChild(li);});}
  function refresh(){
    Promise.all([
      fetch(API+"?week="+wk()).then(function(r){return r.json();}),
      fetch(API).then(function(r){return r.json();})
    ]).then(function(res){
      fill(document.getElementById("sb-week"),res[0]);
      fill(document.getElementById("sb-all"),res[1]);
      document.getElementById("sb-weeklabel").textContent="Week of "+wk()+" - resets Monday";
      document.getElementById("sideboard").hidden=false;
    }).catch(function(){});
  }
  refresh();setInterval(refresh,45000);
})();
</script>

var crashBuf=null,crashLoading=false,lastCrash=0;
function loadCrash(){var a=ac();if(!a||crashBuf||crashLoading)return;crashLoading=true;
  try{var bin=atob(CRASH_B64),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    a.decodeAudioData(arr.buffer,function(b){crashBuf=b;},function(){crashBuf=null;});}catch(e){}}
function playCrash(vol,rate){var a=ac();if(!a)return false;loadCrash();if(!crashBuf)return false;
  var t=performance.now();if(t-lastCrash<90)return true;lastCrash=t;
  try{var s=a.createBufferSource(),v=a.createGain();s.buffer=crashBuf;s.playbackRate.value=rate||1;v.gain.value=vol||0.5;s.connect(v);v.connect(a.destination);s.start();return true;}catch(e){return false;}}

/* ---------- scoring ---------- */
function frameTotals(r){
  var out=[],i=0,run=0;
  for(var f=0;f<10;f++){
    if(i>=r.length){out.push(null);continue;}
    var s=null;
    if(r[i]===10){if(i+2<r.length)s=10+r[i+1]+r[i+2];i+=1;}
    else if(i+1<r.length&&r[i]+r[i+1]===10){if(i+2<r.length)s=10+r[i+2];i+=2;}
    else if(i+1<r.length){s=r[i]+r[i+1];i+=2;}
    else{i+=1;}
    if(s==null)out.push(null);else{run+=s;out.push(run);}
  }
  for(var k=1;k<10;k++)if(out[k-1]==null)out[k]=null;
  return out;
}
function frameMarks(){
  var r=g.rolls,i=0,res=[];
  for(var f=0;f<9;f++){var m=['',''];if(i<r.length){if(r[i]===10){m=['','X'];i++;}else{m[0]=r[i]===0?'-':String(r[i]);if(i+1<r.length)m[1]=r[i]+r[i+1]===10?'/':(r[i+1]===0?'-':String(r[i+1]));i+=2;}}res.push(m);}
  var t=r.slice(i),m3=['','',''];
  t.forEach(function(v,k){if(v===10)m3[k]='X';else if(k>0&&t[k-1]!==10&&t[k-1]+v===10)m3[k]='/';else m3[k]=v===0?'-':String(v);});
  res.push(m3);return res;
}
function total(){var t=frameTotals(g.rolls),v=0;for(var i=0;i<10;i++)if(t[i]!=null)v=t[i];return v;}

/* the hook: ball travels straight for 40% of the lane, then bends with the spin */
function hookX(x0,spin,y){return y>0.4?x0+spin*Math.pow((y-0.4)/0.6,1.35)*0.6:x0;}

function hookAx(spin,y,vy){var r=y<0.35?0:Math.min(1,(y-0.35)/0.4);return spin*0.75*r*r*(0.33/Math.max(vy||0.33,0.10));}

function updateParts(dt){
  for(var i=g.parts.length-1;i>=0;i--){var p=g.parts[i];

var SKINS=['#b8845c','#7a4a2a','#d9a577','#5a3520','#c9946a','#3d2415'],

function crowdSlot(n){ /* two columns per side, from the foreground floor up the lane rail */
  var side=n%2?1:-1,k=Math.floor(n/2),row=Math.floor(k/2),col=k%2;
  var y=Math.max(536,772-row*30),x0=15+col*27+((row%2)*9)+((k*13)%7);
  return {x:side<0?x0:W-x0,y:y,side:side};
}
function seedCrowd(){for(var n=0;n<6;n++)addFan(n,true);}
function addFan(n,instant){
  var sl=crowdSlot(n),female=(n*7+3)%5<2;
  g.crowd.push({n:n,x:sl.x,y:sl.y,tx:sl.x,side:sl.side,ex:sl.side<0?-40:W+40,
    skin:SKINS[n%SKINS.length],shirt:SHIRTS[(n*5+1)%SHIRTS.length],hair:HAIRC[n%HAIRC.length],
    female:female,hairStyle:(n*3)%4,phone:(n*11)%10<6,flashT:0,foodE:(((n*13)%10<4)&&(n*11)%10>=6)?['\ud83c\udf69','\ud83c\udf55','\ud83c\udf54','\ud83c\udf2d','\ud83c\udf5f'][n%5]:null,
    sign:!female&&n%4===0?SIGNS[Math.floor(n/4)%SIGNS.length]:null,state:'in',a:instant?1:0,ph:Math.random()*6.3});
  if(!instant){g.crowd[g.crowd.length-1].x=g.crowd[g.crowd.length-1].ex;}

function crowdUpdate(dt){
  if(g.boo>0)g.boo-=dt;
  var present=g.crowd.filter(function(f){return f.state!=='out';});
  if(present.length<g.crowdTarget){var used=present.map(function(f){return f.n;});var n=0;while(used.indexOf(n)>=0)n++;addFan(n,false);}
  else if(present.length>g.crowdTarget){var leaving=present.filter(function(f){return f.state==='in';});if(leaving.length){var f=leaving[Math.floor(Math.random()*leaving.length)];f.state='out';f.lt=0;}}
  for(var i=g.crowd.length-1;i>=0;i--){var c=g.crowd[i];c.ph+=dt*4;if(c.flashT>0)c.flashT-=dt;
    if(c.phone&&(g.cheer>0||g.streak>=3)&&Math.random()<dt*(2+(g.streak||0)*3+(g.confT>0?8:0)))c.flashT=0.12; /* phones come out while cheering */
    if(c.phone&&g.papT>0&&Math.random()<dt*7)c.flashT=0.09+Math.random()*0.08;
    if(c.chantT>0)c.chantT-=dt;
    if(c.hypeT>0)c.hypeT-=dt;
    if(c.state==='in'&&Math.random()<dt*0.08)c.hypeT=0.9+Math.random()*0.8;
    if(c.state==='in'&&(g.streak>=2||g.confT>0||g.cheer>0.6)&&Math.random()<dt*0.55)c.chantT=1.1; /* the crowd starts the ANTIDOTE chant */
    if(c.state==='in'){c.x+=(c.tx-c.x)*Math.min(1,dt*4);c.a=Math.min(1,c.a+dt*2);if(Math.random()<dt*0.12){var sl2=crowdSlot(c.n);c.tx=sl2.x+(Math.random()-0.5)*18;}}
    else{c.x+=(c.ex-c.x)*Math.min(1,dt*1.6);c.lt+=dt;if(c.lt>1.6)g.crowd.splice(i,1);}
  }
}
function crowdReact(total,goodRoll,pinsDown){
  /* going viral: the crowd grows with the score, extra on big rolls */
  var byScore=5+Math.floor(total/6)+(goodRoll?2:0);
  g.crowdTarget=Math.max(1,Math.min(34,byScore));
  /* under 5 pins: the crowd boos, and every fan has a 40% chance to walk out */
  if(pinsDown<5&&!goodRoll){
    g.boo=1.7;sfx.boo();
    var present=g.crowd.filter(function(f){return f.state==='in';}),left=0;
    present.forEach(function(f){if(Math.random()<0.4){f.state='out';f.lt=0;left++;}});
    g.crowdTarget=Math.max(1,Math.min(g.crowdTarget,present.length-left));
  }
}

function drawCrowd(){
  var cfade=1;
  if(USE3D&&window.B3D&&B3D.ok&&B3D.camZ){try{cfade=Math.max(0,Math.min(1,(B3D.camZ()-0.4)/1.35));}catch(e){}}

  else lt={x:W/2,y:LANE_BOT+46}; /* the bowler */
  g.crowd.slice().sort(function(a,b){return a.y-b.y;}).forEach(function(c){
    var sc=(0.52+0.48*Math.max(0,Math.min(1,(c.y-536)/236)))*1.35;

    var dxn=lt.x-c.x,dyn=lt.y-(c.y-52*sc);

    ctx.fillStyle='#241a16';ctx.beginPath();ctx.ellipse(-4.5+step,0,4,2,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(4.5-step,0,4,2,0,0,7);ctx.fill();

    else{rr(-9.5,-44,19,25,4);ctx.fill();}
    ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(3.5,-44,5.5,c.female?26:25);
    if(boo&&c.state==='in'){ /* arms crossed */

    else if(c.sign&&c.state==='in'){var sy=ch2?-84:-76;ctx.strokeStyle='#8a5a2e';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(9,-40);ctx.lineTo(13,sy+10);ctx.stroke();ctx.fillStyle='#fbe9c4';rr(-8,sy-9,42,18,2);ctx.fill();ctx.strokeStyle='#8a5a2e';ctx.lineWidth=1.5;rr(-8,sy-9,42,18,2);ctx.stroke();txt(c.sign,13,sy,'bold 9px Impact,"Arial Black",sans-serif','#b8322c');}
    else if(ch2){ctx.strokeStyle=c.skin;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-9,-38);ctx.lineTo(-15,-58);ctx.moveTo(9,-38);ctx.lineTo(15,-58);ctx.stroke();}

/* ---------- leaderboard ---------- */
function weekKey(){var d=new Date();var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekLabel(){var k=weekKey().split('-');return 'Week of '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+k[1]-1]+' '+(+k[2]);}
function localBoard(){try{var all=JSON.parse(localStorage.getItem('adb_board')||'{}');return all[weekKey()]||[];}catch(e){return [];}}
function localSave(name,score){try{var all=JSON.parse(localStorage.getItem('adb_board')||'{}');var w=weekKey();all[w]=(all[w]||[]).concat([{name:name,score:score}]).sort(function(a,b){return b.score-a.score;}).slice(0,10);localStorage.setItem('adb_board',JSON.stringify(all));}catch(e){}}
function loadBoard(){
  g.board=null;
  if(!LEADERBOARD_URL){g.board=localBoard();return;}
  fetch(LEADERBOARD_URL+'?week='+weekKey()).then(function(r){return r.json();}).then(function(rows){g.board=rows.slice(0,10);}).catch(function(){g.board=localBoard();});
}
function submitScore(){
  if(g.submitted)return;g.submitted=true;
  var sc=total()+(g.bonus||0);if(sc<=0){loadBoard();return;}
  var last='';try{last=localStorage.getItem('adb_name')||'';}catch(e){}
  g.nameEntry={name:last.slice(0,12),score:sc,blink:0};
}
function finishName(name){
  var sc=g.nameEntry?g.nameEntry.score:0;g.nameEntry=null;
  name=(name||'').trim().slice(0,12);
  if(!name||sc<=0){loadBoard();return;}
  try{localStorage.setItem('adb_name',name);}catch(e){}
  localSave(name,sc);
  if(LEADERBOARD_URL){fetch(LEADERBOARD_URL,{method:'POST',body:JSON.stringify({name:name,score:sc,week:weekKey()}),headers:{'Content-Type':'text/plain'}}).then(function(){setTimeout(loadBoard,600);}).catch(loadBoard);}
  else loadBoard();
}
var KEYROWS=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];

    var x0=W/2-(row.length*(kw+gap)-gap)/2,y=352+r*(kh+gap+4);
    for(var i=0;i<row.length;i++)out.push({x:x0+i*(kw+gap),y:y,w:kw,h:kh,k:row[i]});
  });
  var y3=352+3*(kh+8);
  out.push({x:W/2-160,y:y3,w:90,h:kh,k:'DEL'});
  out.push({x:W/2-62,y:y3,w:124,h:kh,k:'OK'});
  out.push({x:W/2+70,y:y3,w:90,h:kh,k:'SKIP'});
  return out;
}
function drawNameEntry(){

/* ---------- strike / spare animations ---------- */
function easeOut(t){return 1-Math.pow(1-t,3);}

function drawClamp(t){
